<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Escáner de Inventario
  </title>


  <!-- ZXING -->

  <script
    src="https://unpkg.com/@zxing/browser@latest"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #111;

      color: white;

    }


    body {

      overflow-x: hidden;

    }


    .app {

      min-height: 100vh;

      display: flex;

      flex-direction: column;

    }


    /************************************************
     * HEADER
     ************************************************/

    .header {

      padding: 16px;

      background: #202124;

      text-align: center;

      flex-shrink: 0;

    }


    .header h1 {

      margin: 0;

      font-size: 20px;

    }


    .header p {

      margin: 6px 0 0;

      color: #b8b8b8;

      font-size: 13px;

    }


    /************************************************
     * VIDEO
     ************************************************/

    .scanner {

      flex: 1;

      display: flex;

      flex-direction: column;

      min-height: 0;

    }


    .video-container {

      position: relative;

      flex: 1;

      background: black;

      min-height: 48vh;

      overflow: hidden;

    }


    #video {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

      background: black;

    }


    /************************************************
     * MARCO
     ************************************************/

    .frame {

      position: absolute;

      top: 50%;

      left: 50%;

      width: 88%;

      height: 30%;

      transform:
        translate(-50%, -50%);

      border:
        2px solid
        rgba(255,255,255,.25);

      pointer-events: none;

    }


    .corner {

      position: absolute;

      width: 34px;

      height: 34px;

      border-color: #00ff88;

      border-style: solid;

    }


    .top-left {

      top: -2px;

      left: -2px;

      border-width:
        4px 0 0 4px;

    }


    .top-right {

      top: -2px;

      right: -2px;

      border-width:
        4px 4px 0 0;

    }


    .bottom-left {

      bottom: -2px;

      left: -2px;

      border-width:
        0 0 4px 4px;

    }


    .bottom-right {

      bottom: -2px;

      right: -2px;

      border-width:
        0 4px 4px 0;

    }


    .line {

      position: absolute;

      left: 0;

      right: 0;

      top: 50%;

      height: 2px;

      background: #00ff88;

      box-shadow:
        0 0 8px
        rgba(0,255,136,.8);

      animation:
        scan 1.8s infinite;

    }


    @keyframes scan {

      0% {
        transform: translateY(-55px);
      }

      50% {
        transform: translateY(55px);
      }

      100% {
        transform: translateY(-55px);
      }

    }


    /************************************************
     * ESTADO
     ************************************************/

    .status {

      padding: 14px;

      text-align: center;

      background: #202124;

      font-size: 14px;

      font-weight: 600;

      min-height: 48px;

    }


    .status.success {

      background: #137333;

    }


    .status.error {

      background: #8b1e1e;

    }


    /************************************************
     * RESULTADO
     ************************************************/

    .result {

      display: none;

      background: #202124;

      padding: 14px;

      text-align: center;

    }


    .result.show {

      display: block;

    }


    .result-label {

      font-size: 12px;

      color: #aaa;

      margin-bottom: 6px;

    }


    .result-code {

      font-size: 22px;

      font-weight: 700;

      word-break: break-all;

      background: #111;

      padding: 12px;

      border-radius: 8px;

      margin-bottom: 10px;

    }


    /************************************************
     * FOTO
     ************************************************/

    .photo-area {

      display: none;

      background: #202124;

      padding: 10px;

      text-align: center;

    }


    .photo-area.show {

      display: block;

    }


    #photoPreview {

      max-width: 100%;

      max-height: 260px;

      border-radius: 8px;

      background: black;

    }


    /************************************************
     * BOTONES
     ************************************************/

    .actions {

      padding: 12px;

      background: #202124;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;

      flex-shrink: 0;

    }


    button {

      width: 100%;

      min-height: 46px;

      border: none;

      border-radius: 9px;

      background: #1a73e8;

      color: white;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

      padding: 8px;

    }


    button.secondary {

      background: #5f6368;

    }


    button.success {

      background: #0f9d58;

    }


    button.warning {

      background: #f29900;

    }


    button:disabled {

      opacity: .45;

      cursor: not-allowed;

    }


    /************************************************
     * INPUT OCULTO
     ************************************************/

    #fileInput {

      display: none;

    }


    /************************************************
     * INFO
     ************************************************/

    .help {

      background: #181818;

      color: #aaa;

      padding: 9px 12px;

      text-align: center;

      font-size: 11px;

      line-height: 1.4;

    }


    @media (max-width: 500px) {

      .header h1 {

        font-size: 18px;

      }


      .video-container {

        min-height: 46vh;

      }


      .actions {

        grid-template-columns:
          1fr 1fr;

      }


      button {

        font-size: 13px;

      }

    }

  </style>

</head>


<body>


<div class="app">


  <!-- ============================================
       HEADER
       ============================================ -->

  <div class="header">

    <h1>
      📷 Escáner de inventario
    </h1>

    <p>
      Código de barras o código QR
    </p>

  </div>


  <!-- ============================================
       ESCÁNER
       ============================================ -->

  <div class="scanner">


    <div class="video-container">

      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>


      <div class="frame">

        <div class="corner top-left"></div>

        <div class="corner top-right"></div>

        <div class="corner bottom-left"></div>

        <div class="corner bottom-right"></div>

        <div class="line"></div>

      </div>

    </div>


    <!-- ESTADO -->

    <div
      id="status"
      class="status"
    >

      Iniciando cámara...

    </div>


    <!-- RESULTADO -->

    <div
      id="result"
      class="result"
    >

      <div class="result-label">

        Código detectado

      </div>


      <div
        id="resultCode"
        class="result-code"
      ></div>


      <button
        class="success"
        onclick="copiarResultado()"
      >

        📋 Copiar código

      </button>

    </div>


    <!-- FOTO -->

    <div
      id="photoArea"
      class="photo-area"
    >

      <img
        id="photoPreview"
        alt="Fotografía tomada"
      >

    </div>


    <!-- BOTONES -->

    <div class="actions">

      <button
        id="btnFoto"
        class="warning"
        onclick="tomarFoto()"
      >

        📸 Tomar foto y analizar

      </button>


      <button
        class="secondary"
        onclick="cancelar()"
      >

        ← Volver

      </button>

    </div>


    <div class="help">

      Para QR pequeños: acérquese al código,
      mantenga el teléfono estable y use
      <strong>Tomar foto y analizar</strong>.

    </div>


  </div>


</div>


<!-- ============================================
     INPUT PARA FOTO
     ============================================ -->

<input
  type="file"
  id="fileInput"
  accept="image/*"
  capture="environment"
>


<script>


/****************************************************
 * VARIABLES
 ****************************************************/

let reader = null;

let controls = null;

let activo = true;

let ultimoCodigo = '';

let procesandoFoto = false;

let videoStream = null;


/****************************************************
 * INICIO
 ****************************************************/

document.addEventListener(
  'DOMContentLoaded',
  iniciar
);


/****************************************************
 * INICIAR CÁMARA
 ****************************************************/

async function iniciar() {

  const status =
    document.getElementById(
      'status'
    );


  try {

    if (
      typeof ZXingBrowser ===
      'undefined'
    ) {

      throw new Error(
        'No se pudo cargar el lector ZXing.'
      );

    }


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Este navegador no permite utilizar la cámara.'
      );

    }


    status.textContent =
      'Solicitando permiso para la cámara...';


    /*
     * Pedimos cámara trasera.
     */

    videoStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: 'environment'
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    const video =
      document.getElementById(
        'video'
      );


    video.srcObject =
      videoStream;


    await video.play();


    status.textContent =
      'Preparando lector...';


    /*
     * Crear lector.
     */

    reader =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    status.textContent =
      'Buscando código de barras o QR...';


    /*
     * Usamos el stream ya abierto.
     */

    controls =
      await reader
        .decodeFromVideoDevice(

          undefined,

          video,

          function(
            result,
            error
          ) {

            if (!activo) {

              return;

            }


            if (result) {

              const codigo =
                result
                  .getText()
                  .trim();


              if (codigo) {

                procesarCodigo(
                  codigo
                );

              }

            }

          }

        );


  } catch (error) {

    console.error(
      error
    );


    activo =
      false;


    status.className =
      'status error';


    status.innerHTML =

      '⚠ No se pudo iniciar la cámara.<br><br>' +

      '<small>' +

      explicarError(error) +

      '</small>';

  }

}


/****************************************************
 * EXPLICAR ERROR
 ****************************************************/

function explicarError(error) {

  if (!error) {

    return 'Error desconocido.';

  }


  if (
    error.name ===
    'NotAllowedError'
  ) {

    return (
      'Debe permitir el acceso a la cámara ' +
      'para esta página.'
    );

  }


  if (
    error.name ===
    'NotFoundError'
  ) {

    return (
      'No se encontró una cámara.'
    );

  }


  if (
    error.name ===
    'NotReadableError'
  ) {

    return (
      'La cámara está siendo utilizada ' +
      'por otra aplicación.'
    );

  }


  return (
    error.message ||
    String(error)
  );

}


/****************************************************
 * PROCESAR CÓDIGO
 ****************************************************/

function procesarCodigo(
  codigo
) {

  if (!activo) {

    return;

  }


  if (!codigo) {

    return;

  }


  /*
   * Evitar que el mismo código
   * se dispare muchas veces.
   */

  if (
    ultimoCodigo ===
    codigo
  ) {

    return;

  }


  ultimoCodigo =
    codigo;


  activo =
    false;


  detenerCamara();


  mostrarResultado(
    codigo
  );

}


/****************************************************
 * MOSTRAR RESULTADO
 ****************************************************/

function mostrarResultado(
  codigo
) {

  const status =
    document.getElementById(
      'status'
    );


  const result =
    document.getElementById(
      'result'
    );


  const resultCode =
    document.getElementById(
      'resultCode'
    );


  resultCode.textContent =
    codigo;


  result.classList.add(
    'show'
  );


  status.className =
    'status success';


  status.textContent =
    '✓ Código leído correctamente';


  ultimoCodigo =
    codigo;

}


/****************************************************
 * DETENER CÁMARA
 ****************************************************/

function detenerCamara() {

  if (controls) {

    try {

      controls.stop();

    } catch (e) {

      console.log(e);

    }

    controls =
      null;

  }


  if (reader) {

    try {

      reader.reset();

    } catch (e) {

      console.log(e);

    }

  }


  if (videoStream) {

    videoStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

    videoStream =
      null;

  }


  const video =
    document.getElementById(
      'video'
    );


  if (
    video &&
    video.srcObject
  ) {

    try {

      video.srcObject
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );

    } catch (e) {

      console.log(e);

    }


    video.srcObject =
      null;

  }

}


/****************************************************
 * COPIAR RESULTADO
 ****************************************************/

async function copiarResultado() {

  if (!ultimoCodigo) {

    return;

  }


  try {

    await navigator
      .clipboard
      .writeText(
        ultimoCodigo
      );


    mostrarEstadoTemporal(
      '✓ Código copiado al portapapeles'
    );


  } catch (error) {

    /*
     * Método alternativo para
     * navegadores que no soporten
     * clipboard moderno.
     */

    const textarea =
      document.createElement(
        'textarea'
      );


    textarea.value =
      ultimoCodigo;


    textarea.style.position =
      'fixed';

    textarea.style.opacity =
      '0';


    document.body.appendChild(
      textarea
    );


    textarea.focus();

    textarea.select();


    try {

      document
        .execCommand(
          'copy'
        );


      mostrarEstadoTemporal(
        '✓ Código copiado'
      );

    } catch (e) {

      mostrarEstadoTemporal(
        'No se pudo copiar automáticamente.'
      );

    }


    document.body.removeChild(
      textarea
    );

  }

}


/****************************************************
 * ESTADO TEMPORAL
 ****************************************************/

function mostrarEstadoTemporal(
  texto
) {

  const status =
    document.getElementById(
      'status'
    );


  status.textContent =
    texto;


  status.className =
    'status success';

}


/****************************************************
 * TOMAR FOTO
 ****************************************************/

function tomarFoto() {

  if (
    procesandoFoto
  ) {

    return;

  }


  /*
   * Abrimos directamente la cámara
   * nativa del teléfono.
   *
   * Esto evita depender de capturas
   * complicadas del video.
   */

  const input =
    document.getElementById(
      'fileInput'
    );


  input.value =
    '';


  input.click();

}


/****************************************************
 * FOTO SELECCIONADA
 ****************************************************/

document
  .getElementById(
    'fileInput'
  )
  .addEventListener(
    'change',
    function(event) {

      const archivo =
        event.target.files &&
        event.target.files[0];


      if (!archivo) {

        return;

      }


      procesarFotografia(
        archivo
      );

    }
  );


/****************************************************
 * PROCESAR FOTOGRAFÍA
 ****************************************************/

async function procesarFotografia(
  archivo
) {

  if (
    procesandoFoto
  ) {

    return;

  }


  procesandoFoto =
    true;


  const boton =
    document.getElementById(
      'btnFoto'
    );


  boton.disabled =
    true;


  boton.textContent =
    '⏳ Analizando...';


  const status =
    document.getElementById(
      'status'
    );


  status.className =
    'status';


  status.textContent =
    'Cargando fotografía...';


  try {

    const imagen =
      await cargarImagen(
        archivo
      );


    mostrarFotografia(
      imagen
    );


    status.textContent =
      'Analizando fotografía...';


    /*
     * Primero intentamos la imagen
     * original.
     */

    let codigo =
      await intentarLeerImagen(
        imagen,
        5000
      );


    /*
     * Si no funcionó,
     * probamos recortes.
     */

    if (!codigo) {

      codigo =
        await intentarVariantes(
          imagen
        );

    }


    if (codigo) {

      procesarCodigo(
        codigo
      );


    } else {

      status.className =
        'status error';


      status.innerHTML =

        '⚠ No se encontró ningún código.<br>' +

        '<small>' +

        'Intente acercarse más, mejorar la iluminación ' +

        'o tomar otra fotografía enfocando el código.</small>';

    }


  } catch (error) {

    console.error(
      error
    );


    status.className =
      'status error';


    status.textContent =
      '⚠ Error al analizar la fotografía.';

  }


  procesandoFoto =
    false;


  boton.disabled =
    false;


  boton.textContent =
    '📸 Tomar foto y analizar';

}


/****************************************************
 * CARGAR IMAGEN
 ****************************************************/

function cargarImagen(
  archivo
) {

  return new Promise(
    function(resolve, reject) {

      const img =
        new Image();


      const url =
        URL.createObjectURL(
          archivo
        );


      img.onload =
        function() {

          URL.revokeObjectURL(
            url
          );


          resolve(
            img
          );

        };


      img.onerror =
        function() {

          URL.revokeObjectURL(
            url
          );


          reject(
            new Error(
              'No se pudo cargar la imagen.'
            )
          );

        };


      img.src =
        url;

    }
  );

}


/****************************************************
 * MOSTRAR FOTO
 ****************************************************/

function mostrarFotografia(
  imagen
) {

  const area =
    document.getElementById(
      'photoArea'
    );


  const preview =
    document.getElementById(
      'photoPreview'
    );


  preview.src =
    imagen.src ||
    '';


  /*
   * Si la imagen es un objeto Image,
   * usamos canvas para generar
   * una vista previa compatible.
   */

  try {

    const canvas =
      document.createElement(
        'canvas'
      );


    const maxWidth =
      900;


    const escala =
      Math.min(
        1,
        maxWidth /
        imagen.naturalWidth
      );


    canvas.width =
      imagen.naturalWidth *
      escala;


    canvas.height =
      imagen.naturalHeight *
      escala;


    const ctx =
      canvas.getContext(
        '2d'
      );


    ctx.drawImage(
      imagen,
      0,
      0,
      canvas.width,
      canvas.height
    );


    preview.src =
      canvas.toDataURL(
        'image/jpeg',
        0.9
      );


    area.classList.add(
      'show'
    );

  } catch (error) {

    console.log(error);

  }

}


/****************************************************
 * LEER IMAGEN CON ZXING
 ****************************************************/

async function intentarLeerImagen(
  imagen,
  tiempoMaximo
) {

  return new Promise(
    async function(resolve) {

      let terminado =
        false;


      const temporizador =
        setTimeout(
          function() {

            if (!terminado) {

              terminado =
                true;

              resolve(
                ''
              );

            }

          },
          tiempoMaximo
        );


      try {

        const canvas =
          document.createElement(
            'canvas'
          );


        canvas.width =
          imagen.naturalWidth;


        canvas.height =
          imagen.naturalHeight;


        const ctx =
          canvas.getContext(
            '2d',
            {
              willReadFrequently: true
            }
          );


        ctx.drawImage(
          imagen,
          0,
          0
        );


        const lector =
          new ZXingBrowser
            .BrowserMultiFormatReader();


        const resultado =
          await lector
            .decodeFromImageUrl(
              canvas.toDataURL(
                'image/jpeg',
                0.95
              )
            );


        if (
          resultado &&
          resultado.text
        ) {

          if (!terminado) {

            terminado =
              true;

            clearTimeout(
              temporizador
            );


            try {

              lector.reset();

            } catch (e) {}


            resolve(
              resultado.text.trim()
            );

          }

        }

      } catch (error) {

        if (!terminado) {

          terminado =
            true;

          clearTimeout(
            temporizador
          );


          resolve(
            ''
          );

        }

      }

    }
  );

}


/****************************************************
 * VARIANTES DE IMAGEN
 *
 * Esto ayuda especialmente con
 * códigos QR pequeños.
 ****************************************************/

async function intentarVariantes(
  imagen
) {

  /*
   * 1. Recorte central.
   */

  let codigo =
    await intentarRecorte(
      imagen,
      0.70,
      0.70
    );


  if (codigo) {

    return codigo;

  }


  /*
   * 2. Recorte más pequeño.
   */

  codigo =
    await intentarRecorte(
      imagen,
      0.50,
      0.50
    );


  if (codigo) {

    return codigo;

  }


  /*
   * 3. Parte central ampliada.
   */

  codigo =
    await intentarRecorte(
      imagen,
      0.35,
      0.35
    );


  if (codigo) {

    return codigo;

  }


  return '';

}


/****************************************************
 * RECORTE
 ****************************************************/

async function intentarRecorte(
  imagen,
  porcentajeAncho,
  porcentajeAlto
) {

  const ancho =
    imagen.naturalWidth;


  const alto =
    imagen.naturalHeight;


  const recorteAncho =
    Math.floor(
      ancho *
      porcentajeAncho
    );


  const recorteAlto =
    Math.floor(
      alto *
      porcentajeAlto
    );


  const x =
    Math.floor(
      (ancho -
       recorteAncho) /
      2
    );


  const y =
    Math.floor(
      (alto -
       recorteAlto) /
      2
    );


  /*
   * Ampliamos el recorte.
   */

  const escala =
    Math.min(
      3,
      1200 /
      recorteAncho
    );


  const canvas =
    document.createElement(
      'canvas'
    );


  canvas.width =
    Math.floor(
      recorteAncho *
      escala
    );


  canvas.height =
    Math.floor(
      recorteAlto *
      escala
    );


  const ctx =
    canvas.getContext(
      '2d',
      {
        willReadFrequently: true
      }
    );


  ctx.imageSmoothingEnabled =
    false;


  ctx.drawImage(

    imagen,

    x,
    y,

    recorteAncho,
    recorteAlto,

    0,
    0,

    canvas.width,
    canvas.height

  );


  /*
   * Intentamos lectura.
   */

  try {

    const lector =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    const resultado =
      await lector
        .decodeFromImageUrl(
          canvas.toDataURL(
            'image/jpeg',
            1
          )
        );


    try {

      lector.reset();

    } catch (e) {}


    if (
      resultado &&
      resultado.text
    ) {

      return resultado
        .text
        .trim();

    }

  } catch (error) {

    console.log(
      'Recorte no leído',
      error
    );

  }


  return '';

}


/****************************************************
 * VOLVER
 ****************************************************/

function cancelar() {

  activo =
    false;


  detenerCamara();


  window.history.back();

}


/****************************************************
 * LIMPIAR AL SALIR
 ****************************************************/

window.addEventListener(
  'pagehide',
  function() {

    activo =
      false;

    detenerCamara();

  }
);


window.addEventListener(
  'beforeunload',
  function() {

    activo =
      false;

    detenerCamara();

  }
);

</script>
