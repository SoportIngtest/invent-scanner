<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Escáner de Inventario
  </title>


  <!-- ZXing -->

  <script
    src="https://unpkg.com/@zxing/browser@latest"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }


    body {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #111;

      color: white;

    }


    .app {

      min-height: 100vh;

      display: flex;

      flex-direction: column;

    }


    /************************************************
     * HEADER
     ************************************************/

    .header {

      padding: 14px 16px;

      background: #202124;

      text-align: center;

    }


    .header h1 {

      margin: 0;

      font-size: 20px;

    }


    .header p {

      margin: 6px 0 0;

      color: #b8b8b8;

      font-size: 13px;

    }


    /************************************************
     * SELECTOR DE MODO
     ************************************************/

    .mode-selector {

      padding: 12px;

      background: #292a2d;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;

    }


    .mode-button {

      min-height: 50px;

      border: 2px solid #5f6368;

      border-radius: 10px;

      background: #202124;

      color: #d7d7d7;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

      transition:
        background .15s,
        border-color .15s,
        transform .1s;

    }


    .mode-button:active {

      transform: scale(.98);

    }


    .mode-button.active {

      background: #1a73e8;

      border-color: #8ab4f8;

      color: white;

    }


    .mode-button .mode-icon {

      display: block;

      font-size: 21px;

      margin-bottom: 2px;

    }


    /************************************************
     * SCANNER
     ************************************************/

    .scanner {

      flex: 1;

      display: flex;

      flex-direction: column;

    }


    /************************************************
     * VIDEO
     ************************************************/

    .video-container {

      position: relative;

      flex: 1;

      background: black;

      min-height: 55vh;

      overflow: hidden;

    }


    #video {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

    }


    /************************************************
     * MARCO GENERAL
     ************************************************/

    .frame {

      position: absolute;

      top: 50%;

      left: 50%;

      transform:
        translate(-50%, -50%);

      pointer-events: none;

      transition:
        width .2s,
        height .2s;

    }


    /************************************************
     * MODO BARRAS
     *
     * Conservamos la lógica visual original:
     * área horizontal.
     ************************************************/

    .frame.barcode-frame {

      width: 86%;

      height: 28%;

      border:
        2px solid
        rgba(255,255,255,.25);

    }


    /************************************************
     * MODO QR
     *
     * Área cuadrada mucho más grande.
     *
     * Esto permite que un QR pequeño ocupe
     * una zona mucho mayor de la cámara.
     ************************************************/

    .frame.qr-frame {

      width: 82vw;

      height: 82vw;

      max-width: 82vh;

      max-height: 82vh;

      border:
        2px solid
        rgba(255,255,255,.35);

    }


    /************************************************
     * ESQUINAS
     ************************************************/

    .corner {

      position: absolute;

      width: 36px;

      height: 36px;

      border-color: #00ff88;

      border-style: solid;

    }


    .top-left {

      top: -2px;

      left: -2px;

      border-width:
        4px 0 0 4px;

    }


    .top-right {

      top: -2px;

      right: -2px;

      border-width:
        4px 4px 0 0;

    }


    .bottom-left {

      bottom: -2px;

      left: -2px;

      border-width:
        0 0 4px 4px;

    }


    .bottom-right {

      bottom: -2px;

      right: -2px;

      border-width:
        0 4px 4px 0;

    }


    /************************************************
     * LINEA DE ESCANEO
     ************************************************/

    .line {

      position: absolute;

      left: 0;

      right: 0;

      top: 50%;

      height: 2px;

      background: #00ff88;

      animation:
        scanBarcode 1.8s infinite;

    }


    @keyframes scanBarcode {

      0% {
        transform:
          translateY(-45px);
      }

      50% {
        transform:
          translateY(45px);
      }

      100% {
        transform:
          translateY(-45px);
      }

    }


    /************************************************
     * LINEA QR
     *
     * Movimiento más corto dentro del cuadro.
     ************************************************/

    .qr-frame .line {

      left: 5%;

      right: 5%;

      animation:
        scanQr 2s infinite;

    }


    @keyframes scanQr {

      0% {
        transform:
          translateY(-30%);
      }

      50% {
        transform:
          translateY(30%);
      }

      100% {
        transform:
          translateY(-30%);
      }

    }


    /************************************************
     * ESTADO
     ************************************************/

    .status {

      padding: 14px;

      text-align: center;

      background: #202124;

      font-size: 14px;

      font-weight: 600;

      min-height: 48px;

    }


    /************************************************
     * RESULTADO
     ************************************************/

    .result {

      display: none;

      padding: 15px;

      background: #17251d;

      border-top:
        1px solid #2d573c;

    }


    .result.visible {

      display: block;

    }


    .result-title {

      color: #7dffad;

      font-size: 12px;

      font-weight: 700;

      margin-bottom: 6px;

    }


    .result-code {

      background: #111;

      border-radius: 8px;

      padding: 12px;

      word-break: break-all;

      font-size: 16px;

      line-height: 1.4;

      user-select: text;

    }


    /************************************************
     * BOTONES
     ************************************************/

    .actions {

      padding: 12px;

      background: #202124;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;

    }


    button {

      width: 100%;

      min-height: 46px;

      border: none;

      border-radius: 9px;

      background: #1a73e8;

      color: white;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

    }


    button.secondary {

      background: #5f6368;

    }


    button.green {

      background: #0f9d58;

    }


    button.orange {

      background: #e37400;

    }


    button:disabled {

      opacity: .45;

      cursor: not-allowed;

    }


    /************************************************
     * FOTO
     ************************************************/

    .photo-area {

      display: none;

      background: #000;

      padding: 10px;

    }


    .photo-area.visible {

      display: block;

    }


    #capturedImage {

      width: 100%;

      max-height: 45vh;

      object-fit: contain;

      display: block;

      margin: auto;

      border-radius: 8px;

    }


    #canvas {

      display: none;

    }


    /************************************************
     * AYUDA
     ************************************************/

    .help {

      padding: 12px 15px;

      background: #292a2d;

      color: #b8b8b8;

      font-size: 12px;

      line-height: 1.5;

      text-align: center;

    }


    .help strong {

      color: white;

    }


    /************************************************
     * CELULAR
     ************************************************/

    @media (max-width: 480px) {

      .header {

        padding:
          12px;

      }


      .header h1 {

        font-size: 18px;

      }


      .mode-selector {

        padding: 10px;

      }


      .mode-button {

        min-height: 54px;

        font-size: 13px;

      }


      .mode-button .mode-icon {

        font-size: 20px;

      }


      .frame.barcode-frame {

        width: 92%;

        height: 30%;

      }


      .frame.qr-frame {

        width: 88vw;

        height: 88vw;

        max-width: 88vh;

        max-height: 88vh;

      }


      button {

        font-size: 13px;

      }

    }


    /************************************************
     * PANTALLAS MUY BAJAS
     ************************************************/

    @media (
      max-height: 650px
    ) {

      .video-container {

        min-height: 45vh;

      }


      .frame.qr-frame {

        width: 72vh;

        height: 72vh;

        max-width: 82vw;

        max-height: 82vw;

      }

    }

  </style>

</head>


<body>


<div class="app">


  <!-- ============================================
       HEADER
       ============================================ -->

  <div class="header">

    <h1>
      📷 Escáner de inventario
    </h1>

    <p id="subtitulo">
      Código de barras
    </p>

  </div>


  <!-- ============================================
       SELECTOR DE MODO
       ============================================ -->

  <div class="mode-selector">


    <button
      type="button"
      id="modoBarras"
      class="mode-button active"
      onclick="seleccionarModo('barras')"
    >

      <span class="mode-icon">
        ▥
      </span>

      Código de barras

    </button>


    <button
      type="button"
      id="modoQr"
      class="mode-button"
      onclick="seleccionarModo('qr')"
    >

      <span class="mode-icon">
        ▦
      </span>

      Código QR

    </button>


  </div>


  <div class="scanner">


    <!-- =========================================
         CÁMARA
         ========================================= -->

    <div
      id="videoContainer"
      class="video-container"
    >


      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>


      <div
        id="frame"
        class="frame barcode-frame"
      >

        <div class="corner top-left"></div>

        <div class="corner top-right"></div>

        <div class="corner bottom-left"></div>

        <div class="corner bottom-right"></div>

        <div class="line"></div>

      </div>


    </div>


    <!-- =========================================
         FOTO CAPTURADA
         ========================================= -->

    <div
      id="photoArea"
      class="photo-area"
    >

      <img
        id="capturedImage"
        alt="Imagen capturada"
      >

    </div>


    <canvas
      id="canvas"
    ></canvas>


    <!-- =========================================
         ESTADO
         ========================================= -->

    <div
      id="status"
      class="status"
    >

      Iniciando cámara...

    </div>


    <!-- =========================================
         RESULTADO
         ========================================= -->

    <div
      id="result"
      class="result"
    >

      <div class="result-title">

        ✓ CÓDIGO DETECTADO

      </div>


      <div
        id="resultCode"
        class="result-code"
      ></div>

    </div>


    <!-- =========================================
         AYUDA
         ========================================= -->

    <div
      id="help"
      class="help"
    >

      Apunte al código de barras dentro del
      área horizontal.

      Si no lo detecta, pulse
      <strong>📸 Tomar foto</strong>.

    </div>


    <!-- =========================================
         BOTONES
         ========================================= -->

    <div class="actions">


      <button
        id="btnFoto"
        class="orange"
        onclick="tomarFoto()"
      >

        📸 Tomar foto

      </button>


      <button
        id="btnCopiar"
        class="green"
        onclick="copiarResultado()"
        disabled
      >

        📋 Copiar

      </button>


      <button
        id="btnNuevo"
        class="secondary"
        onclick="nuevoEscaneo()"
      >

        🔄 Escanear de nuevo

      </button>


      <button
        id="btnSalir"
        class="secondary"
        onclick="salir()"
      >

        ✕ Salir

      </button>


    </div>


  </div>


</div>


<script>


/****************************************************
 * VARIABLES
 ****************************************************/


let reader = null;

let controls = null;

let activo = true;

let codigoDetectado = '';

let dispositivoSeleccionado = null;


/*
 * Modo actual.
 *
 * 'barras'
 * 'qr'
 */

let modoActual = 'barras';


/*
 * Evita iniciar varias cámaras
 * simultáneamente.
 */

let iniciandoCamara = false;


/****************************************************
 * FORMATOS DE CÓDIGOS DE BARRAS
 *
 * Se mantienen los formatos generales.
 ****************************************************/


const FORMATOS_BARRAS = [

  ZXingBrowser.BarcodeFormat.CODE_128,

  ZXingBrowser.BarcodeFormat.CODE_39,

  ZXingBrowser.BarcodeFormat.CODE_93,

  ZXingBrowser.BarcodeFormat.CODABAR,

  ZXingBrowser.BarcodeFormat.EAN_8,

  ZXingBrowser.BarcodeFormat.EAN_13,

  ZXingBrowser.BarcodeFormat.ITF,

  ZXingBrowser.BarcodeFormat.UPC_A,

  ZXingBrowser.BarcodeFormat.UPC_E,

  ZXingBrowser.BarcodeFormat.RSS_14,

  ZXingBrowser.BarcodeFormat.RSS_EXPANDED

];


/****************************************************
 * INICIO
 ****************************************************/


document.addEventListener(
  'DOMContentLoaded',
  iniciar
);


/****************************************************
 * SELECCIONAR MODO
 ****************************************************/


function seleccionarModo(
  modo
) {

  if (
    modo !== 'barras' &&
    modo !== 'qr'
  ) {

    return;

  }


  modoActual =
    modo;


  const botonBarras =
    document.getElementById(
      'modoBarras'
    );


  const botonQr =
    document.getElementById(
      'modoQr'
    );


  const frame =
    document.getElementById(
      'frame'
    );


  const subtitulo =
    document.getElementById(
      'subtitulo'
    );


  const help =
    document.getElementById(
      'help'
    );


  botonBarras.classList.toggle(
    'active',
    modo === 'barras'
  );


  botonQr.classList.toggle(
    'active',
    modo === 'qr'
  );


  frame.classList.remove(
    'barcode-frame',
    'qr-frame'
  );


  if (
    modo === 'qr'
  ) {

    frame.classList.add(
      'qr-frame'
    );


    subtitulo.textContent =
      'Código QR';


    help.innerHTML =

      'Modo QR activado. ' +

      'Coloque el código dentro del cuadro. ' +

      'El área de lectura es amplia para códigos pequeños. ' +

      'Si no lo detecta, pulse <strong>📸 Tomar foto</strong>.';


  } else {

    frame.classList.add(
      'barcode-frame'
    );


    subtitulo.textContent =
      'Código de barras';


    help.innerHTML =

      'Modo barras activado. ' +

      'Apunte al código dentro del área horizontal. ' +

      'Si no lo detecta, pulse <strong>📸 Tomar foto</strong>.';

  }


  /*
   * Si la cámara está activa,
   * reiniciamos la lectura para aplicar
   * el nuevo formato.
   */

  if (
    reader &&
    activo
  ) {

    reiniciarLectura();

  }

}


/****************************************************
 * INICIO DE CÁMARA
 ****************************************************/


async function iniciar() {

  const status =
    document.getElementById(
      'status'
    );


  try {

    if (
      typeof ZXingBrowser ===
      'undefined'
    ) {

      throw new Error(
        'No se pudo cargar ZXing.'
      );

    }


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Este navegador no permite utilizar la cámara.'
      );

    }


    status.textContent =
      'Solicitando permiso para la cámara...';


    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {

            ideal:
              'environment'

          },

          width: {

            ideal: 1920

          },

          height: {

            ideal: 1080

          }

        },

        audio: false

      });


    /*
     * Solo usamos este stream temporalmente
     * para confirmar que tenemos permiso.
     */

    stream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });


    status.textContent =
      'Buscando cámara...';


    reader =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    const dispositivos =
      await ZXingBrowser
        .BrowserCodeReader
        .listVideoInputDevices();


    if (
      !dispositivos ||
      dispositivos.length === 0
    ) {

      throw new Error(
        'No se encontró ninguna cámara.'
      );

    }


    dispositivoSeleccionado =
      dispositivos[0];


    /*
     * Buscar preferentemente la cámara trasera.
     */

    for (
      const camara of dispositivos
    ) {

      const label =
        String(
          camara.label || ''
        ).toLowerCase();


      if (

        label.includes('back') ||

        label.includes('rear') ||

        label.includes('environment') ||

        label.includes('trasera') ||

        label.includes('posterior')

      ) {

        dispositivoSeleccionado =
          camara;

        break;

      }

    }


    iniciarLectura();


  } catch (error) {

    console.error(
      error
    );


    activo =
      false;


    status.innerHTML =

      '⚠ Cámara no disponible.<br><br>' +

      '<small>' +

      explicarError(error) +

      '</small>';

  }

}


/****************************************************
 * CREAR LECTOR SEGÚN MODO
 ****************************************************/


function crearLector() {

  /*
   * Para QR utilizamos un lector configurado
   * específicamente para QR.
   *
   * Para barras utilizamos los formatos
   * tradicionales de inventario.
   */


  if (
    modoActual === 'qr'
  ) {

    return new ZXingBrowser
      .BrowserMultiFormatReader();

  }


  /*
   * Modo barras.
   *
   * Conservamos BrowserMultiFormatReader
   * para mantener compatibilidad con tu
   * funcionamiento anterior.
   */

  return new ZXingBrowser
    .BrowserMultiFormatReader();

}


/****************************************************
 * INICIAR LECTURA
 ****************************************************/


async function iniciarLectura() {

  if (
    !reader ||
    iniciandoCamara
  ) {

    return;

  }


  iniciandoCamara =
    true;


  activo =
    true;


  const status =
    document.getElementById(
      'status'
    );


  const video =
    document.getElementById(
      'video'
    );


  status.textContent =

    modoActual === 'qr'

      ? 'Buscando código QR...'

      : 'Apunte al código de barras...';


  try {

    /*
     * En modo QR usamos el lector
     * multi-formato pero filtramos el resultado
     * para aceptar exclusivamente QR.
     */

    const lector =
      crearLector();


    /*
     * Guardamos el lector actual.
     */

    reader =
      lector;


    controls =
      await reader.decodeFromVideoDevice(

        dispositivoSeleccionado
          ? dispositivoSeleccionado.deviceId
          : undefined,

        video,

        function(
          result,
          error
        ) {

          if (!activo) {

            return;

          }


          if (!result) {

            return;

          }


          /*
           * En modo QR solamente aceptamos
           * resultados cuyo formato sea QR.
           */

          if (
            modoActual === 'qr'
          ) {

            try {

              const formato =
                result.getBarcodeFormat();


              const esQr =

                formato ===
                ZXingBrowser.BarcodeFormat.QR_CODE;


              if (!esQr) {

                return;

              }

            } catch (e) {

              /*
               * Si el navegador/versión de ZXing
               * no permite consultar el formato,
               * aceptamos el resultado porque el
               * lector ya está trabajando en modo
               * QR.
               */

            }

          }


          const texto =
            result
              .getText()
              .trim();


          if (!texto) {

            return;

          }


          mostrarResultado(
            texto
          );

        }

      );


  } catch (error) {

    console.error(
      error
    );


    status.textContent =

      modoActual === 'qr'

        ? '⚠ No se pudo iniciar el lector QR.'

        : '⚠ No se pudo iniciar la lectura.';


  } finally {

    iniciandoCamara =
      false;

  }

}


/****************************************************
 * REINICIAR LECTURA
 ****************************************************/


async function reiniciarLectura() {

  activo =
    false;


  detenerCamara();


  /*
   * Pequeña pausa para asegurarnos de que
   * la cámara anterior quedó liberada.
   */

  await esperar(150);


  if (!reader) {

    reader =
      new ZXingBrowser
        .BrowserMultiFormatReader();

  }


  activo =
    true;


  iniciarLectura();

}


/****************************************************
 * ESPERAR
 ****************************************************/


function esperar(
  milisegundos
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        milisegundos
      );

    }
  );

}


/****************************************************
 * MOSTRAR RESULTADO
 ****************************************************/


async function mostrarResultado(
  codigo
) {

  /*
   * Evitar múltiples detecciones
   * consecutivas.
   */

  if (!activo) {

    return;

  }


  activo =
    false;


  detenerCamara();


  codigoDetectado =
    codigo;


  const result =
    document.getElementById(
      'result'
    );


  const resultCode =
    document.getElementById(
      'resultCode'
    );


  const status =
    document.getElementById(
      'status'
    );


  resultCode.textContent =
    codigo;


  result.classList.add(
    'visible'
  );


  status.textContent =
    '✓ Código detectado.';


  document.getElementById(
    'btnCopiar'
  ).disabled = false;


  /*
   * Copiar automáticamente.
   */

  const copiado =
    await copiarAutomaticamente();


  /*
   * Si se pudo copiar,
   * regresar automáticamente.
   */

  if (copiado) {

    setTimeout(
      function() {

        salir();

      },
      300
    );

  }

}


/****************************************************
 * COPIA AUTOMÁTICA
 ****************************************************/


async function copiarAutomaticamente() {

  if (!codigoDetectado) {

    return false;

  }


  try {

    await navigator.clipboard.writeText(
      codigoDetectado
    );


    document.getElementById(
      'status'
    ).textContent =
      '✓ Código copiado. Regresando...';


    return true;


  } catch (error) {

    console.warn(
      'No se pudo copiar automáticamente:',
      error
    );


    document.getElementById(
      'status'
    ).textContent =
      '✓ Código detectado. Pulse "Copiar".';


    return false;

  }

}


/****************************************************
 * COPIAR RESULTADO
 ****************************************************/


async function copiarResultado() {

  if (!codigoDetectado) {

    return;

  }


  try {

    await navigator.clipboard.writeText(
      codigoDetectado
    );


    document.getElementById(
      'status'
    ).textContent =
      '✓ Código copiado.';


  } catch (error) {

    /*
     * Segundo intento utilizando textarea.
     */

    try {

      const textarea =
        document.createElement(
          'textarea'
        );


      textarea.value =
        codigoDetectado;


      textarea.style.position =
        'fixed';

      textarea.style.opacity =
        '0';


      document.body.appendChild(
        textarea
      );


      textarea.focus();

      textarea.select();


      document.execCommand(
        'copy'
      );


      textarea.remove();


      document.getElementById(
        'status'
      ).textContent =
        '✓ Código copiado.';


    } catch (e) {

      document.getElementById(
        'status'
      ).textContent =
        '⚠ No se pudo copiar automáticamente. Mantenga presionado el código para copiarlo.';

    }

  }

}


/****************************************************
 * TOMAR FOTO
 ****************************************************/


function tomarFoto() {

  const video =
    document.getElementById(
      'video'
    );


  const canvas =
    document.getElementById(
      'canvas'
    );


  const image =
    document.getElementById(
      'capturedImage'
    );


  if (
    !video ||
    !video.videoWidth
  ) {

    document.getElementById(
      'status'
    ).textContent =
      '⚠ La cámara todavía no está lista.';

    return;

  }


  /*
   * Detener lectura continua.
   */

  activo =
    false;


  detenerCamara();


  /*
   * Capturar imagen a resolución nativa.
   */

  canvas.width =
    video.videoWidth;


  canvas.height =
    video.videoHeight;


  const ctx =
    canvas.getContext(
      '2d',
      {
        willReadFrequently: true
      }
    );


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  const dataUrl =
    canvas.toDataURL(
      'image/jpeg',
      0.95
    );


  image.src =
    dataUrl;


  document
    .getElementById(
      'photoArea'
    )
    .classList.add(
      'visible'
    );


  document.getElementById(
    'status'
  ).textContent =

    modoActual === 'qr'

      ? 'Analizando fotografía para QR...'

      : 'Analizando fotografía...';


  analizarImagen(
    dataUrl
  );

}


/****************************************************
 * ANALIZAR IMAGEN
 ****************************************************/


async function analizarImagen(
  dataUrl
) {

  try {

    const img =
      new Image();


    img.onload =
      async function() {

        try {

          /*
           * Para QR usamos una resolución mayor.
           *
           * Esto es importante para códigos QR
           * pequeños.
           */

          const maxWidth =

            modoActual === 'qr'

              ? 2400

              : 1800;


          const escala =
            img.width > maxWidth

              ? maxWidth / img.width

              : 1;


          const canvas =
            document.createElement(
              'canvas'
            );


          canvas.width =
            Math.round(
              img.width * escala
            );


          canvas.height =
            Math.round(
              img.height * escala
            );


          const ctx =
            canvas.getContext(
              '2d',
              {
                willReadFrequently: true
              }
            );


          ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
          );


          /*
           * Lector nuevo.
           */

          const lector =
            new ZXingBrowser
              .BrowserMultiFormatReader();


          const resultado =
            await lector
              .decodeFromImageUrl(
                canvas.toDataURL(
                  'image/jpeg',
                  0.95
                )
              );


          if (
            resultado &&
            resultado.getText()
          ) {

            /*
             * En modo QR comprobamos el formato.
             */

            if (
              modoActual === 'qr'
            ) {

              try {

                const formato =
                  resultado
                    .getBarcodeFormat();


                if (
                  formato !==
                  ZXingBrowser.BarcodeFormat.QR_CODE
                ) {

                  throw new Error(
                    'La imagen contiene otro tipo de código.'
                  );

                }

              } catch (formatoError) {

                /*
                 * Si la API no expone el formato,
                 * no bloqueamos el resultado.
                 */

              }

            }


            mostrarResultado(
              resultado
                .getText()
                .trim()
            );


            return;

          }


          throw new Error(
            'No se encontró código.'
          );


        } catch (error) {

          console.warn(
            'No se pudo analizar la imagen:',
            error
          );


          document.getElementById(
            'status'
          ).textContent =

            modoActual === 'qr'

              ? '⚠ No se encontró el QR. Acerque el código y vuelva a tomar la foto.'

              : '⚠ No se encontró un código. Acerque la cámara o vuelva a tomar la foto.';


          activo =
            false;

        }

      };


    img.src =
      dataUrl;


  } catch (error) {

    console.error(
      error
    );


    document.getElementById(
      'status'
    ).textContent =
      '⚠ No se pudo analizar la fotografía.';

  }

}


/****************************************************
 * NUEVO ESCANEO
 ****************************************************/


async function nuevoEscaneo() {

  codigoDetectado =
    '';


  document
    .getElementById(
      'result'
    )
    .classList.remove(
      'visible'
    );


  document
    .getElementById(
      'photoArea'
    )
    .classList.remove(
      'visible'
    );


  document.getElementById(
    'btnCopiar'
  ).disabled = true;


  document.getElementById(
    'status'
  ).textContent =

    modoActual === 'qr'

      ? 'Reiniciando lector QR...'

      : 'Reiniciando cámara...';


  activo =
    false;


  detenerCamara();


  await esperar(150);


  /*
   * Crear lector nuevamente.
   */

  reader =
    crearLector();


  activo =
    true;


  iniciarLectura();

}


/****************************************************
 * DETENER CÁMARA
 ****************************************************/


function detenerCamara() {

  if (controls) {

    try {

      controls.stop();

    } catch (e) {

      console.log(e);

    }


    controls =
      null;

  }


  if (reader) {

    try {

      reader.reset();

    } catch (e) {

      console.log(e);

    }

  }


  const video =
    document.getElementById(
      'video'
    );


  if (
    video &&
    video.srcObject
  ) {

    video.srcObject
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    video.srcObject =
      null;

  }

}


/****************************************************
 * SALIR
 ****************************************************/


function salir() {

  activo =
    false;


  detenerCamara();


  /*
   * Cerrar la pestaña del escáner.
   */

  window.close();


  /*
   * Si el navegador no permite cerrar
   * la pestaña, mostramos instrucciones.
   */

  setTimeout(
    function() {

      document.getElementById(
        'status'
      ).textContent =
        'Puede cerrar esta pestaña manualmente. El código permanece en el portapapeles.';

    },
    300
  );

}


/****************************************************
 * EXPLICAR ERROR
 ****************************************************/


function explicarError(error) {

  if (!error) {

    return 'Error desconocido.';

  }


  const nombre =
    error.name || '';


  if (
    nombre ===
    'NotAllowedError'
  ) {

    return (
      'El navegador no permitió el acceso a la cámara. ' +
      'Revise el permiso de cámara para esta página.'
    );

  }


  if (
    nombre ===
    'NotFoundError'
  ) {

    return (
      'No se encontró una cámara disponible.'
    );

  }


  if (
    nombre ===
    'NotReadableError'
  ) {

    return (
      'La cámara está siendo utilizada por otra aplicación.'
    );

  }


  if (
    nombre ===
    'SecurityError'
  ) {

    return (
      'El navegador bloqueó el acceso a la cámara por seguridad.'
    );

  }


  return (
    error.message ||
    String(error)
  );

}


/****************************************************
 * LIMPIEZA
 ****************************************************/


window.addEventListener(
  'pagehide',
  function() {

    activo =
      false;

    detenerCamara();

  }
);


</script>
