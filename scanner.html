<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Escáner de Inventario
  </title>


  <!-- ZXing -->

  <script
    src="https://unpkg.com/@zxing/browser@latest"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #111;

      color: white;

    }


    .app {

      min-height: 100vh;

      display: flex;

      flex-direction: column;

    }


    .header {

      padding: 16px;

      background: #202124;

      text-align: center;

    }


    .header h1 {

      margin: 0;

      font-size: 20px;

    }


    .header p {

      margin: 6px 0 0;

      color: #b8b8b8;

      font-size: 13px;

    }


    .scanner {

      flex: 1;

      display: flex;

      flex-direction: column;

    }


    .video-container {

      position: relative;

      flex: 1;

      background: black;

      min-height: 55vh;

      overflow: hidden;

    }


    #video {

      width: 100%;

      height: 100%;

      object-fit: cover;

    }


    .frame {

      position: absolute;

      top: 50%;

      left: 50%;

      width: 86%;

      height: 28%;

      transform:
        translate(-50%, -50%);

      border:
        2px solid
        rgba(255,255,255,.25);

      pointer-events: none;

    }


    .corner {

      position: absolute;

      width: 34px;

      height: 34px;

      border-color: #00ff88;

      border-style: solid;

    }


    .top-left {

      top: -2px;

      left: -2px;

      border-width:
        4px 0 0 4px;

    }


    .top-right {

      top: -2px;

      right: -2px;

      border-width:
        4px 4px 0 0;

    }


    .bottom-left {

      bottom: -2px;

      left: -2px;

      border-width:
        0 0 4px 4px;

    }


    .bottom-right {

      bottom: -2px;

      right: -2px;

      border-width:
        0 4px 4px 0;

    }


    .line {

      position: absolute;

      left: 0;

      right: 0;

      top: 50%;

      height: 2px;

      background: #00ff88;

      animation:
        scan 1.8s infinite;

    }


    @keyframes scan {

      0% {
        transform: translateY(-45px);
      }

      50% {
        transform: translateY(45px);
      }

      100% {
        transform: translateY(-45px);
      }

    }


    .status {

      padding: 14px;

      text-align: center;

      background: #202124;

      font-size: 14px;

      font-weight: 600;

    }


    .result {

      display: none;

      padding: 15px;

      background: #17251d;

      border-top:
        1px solid #2d573c;

    }


    .result.visible {

      display: block;

    }


    .result-title {

      color: #7dffad;

      font-size: 12px;

      font-weight: 700;

      margin-bottom: 6px;

    }


    .result-code {

      background: #111;

      border-radius: 8px;

      padding: 12px;

      word-break: break-all;

      font-size: 16px;

      line-height: 1.4;

    }


    .actions {

      padding: 12px;

      background: #202124;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;

    }


    button {

      width: 100%;

      min-height: 46px;

      border: none;

      border-radius: 9px;

      background: #1a73e8;

      color: white;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

    }


    button.secondary {

      background: #5f6368;

    }


    button.green {

      background: #0f9d58;

    }


    button.orange {

      background: #e37400;

    }


    button:disabled {

      opacity: .45;

      cursor: not-allowed;

    }


    .photo-area {

      display: none;

      background: #000;

      padding: 10px;

    }


    .photo-area.visible {

      display: block;

    }


    #capturedImage {

      width: 100%;

      max-height: 45vh;

      object-fit: contain;

      display: block;

      margin: auto;

      border-radius: 8px;

    }


    #canvas {

      display: none;

    }


    .help {

      padding: 12px 15px;

      background: #292a2d;

      color: #b8b8b8;

      font-size: 12px;

      line-height: 1.5;

      text-align: center;

    }


    .resolution-info {

      padding: 8px 12px;

      background: #18191b;

      color: #9aa0a6;

      font-size: 11px;

      text-align: center;

    }


    @media (max-width: 480px) {

      .actions {

        grid-template-columns:
          1fr 1fr;

      }

      button {

        font-size: 13px;

      }

    }

  </style>

</head>


<body>


<div class="app">


  <div class="header">

    <h1>
      📷 Escáner de inventario
    </h1>

    <p>
      Barras y códigos QR
    </p>

  </div>


  <div class="scanner">


    <!-- ========================================
         CÁMARA
         ======================================== -->

    <div class="video-container">


      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>


      <div class="frame">

        <div class="corner top-left"></div>

        <div class="corner top-right"></div>

        <div class="corner bottom-left"></div>

        <div class="corner bottom-right"></div>

        <div class="line"></div>

      </div>


    </div>


    <!-- ========================================
         FOTO CAPTURADA
         ======================================== -->

    <div
      id="photoArea"
      class="photo-area"
    >

      <img
        id="capturedImage"
        alt="Imagen capturada"
      >

    </div>


    <canvas
      id="canvas"
    ></canvas>


    <!-- ========================================
         RESOLUCIÓN
         ======================================== -->

    <div
      id="resolutionInfo"
      class="resolution-info"
    >

      Preparando cámara...

    </div>


    <!-- ========================================
         ESTADO
         ======================================== -->

    <div
      id="status"
      class="status"
    >

      Iniciando cámara...

    </div>


    <!-- ========================================
         RESULTADO
         ======================================== -->

    <div
      id="result"
      class="result"
    >

      <div class="result-title">

        ✓ CÓDIGO DETECTADO

      </div>


      <div
        id="resultCode"
        class="result-code"
      ></div>

    </div>


    <!-- ========================================
         AYUDA
         ======================================== -->

    <div class="help">

      Si la cámara no detecta el código,
      pulse <strong>📸 Tomar foto</strong>.
      Se capturará una fotografía de alta
      resolución y se analizará completa.

    </div>


    <!-- ========================================
         BOTONES
         ======================================== -->

    <div class="actions">

      <button
        id="btnFoto"
        class="orange"
        onclick="tomarFoto()"
      >

        📸 Tomar foto

      </button>


      <button
        id="btnCopiar"
        class="green"
        onclick="copiarResultado()"
        disabled
      >

        📋 Copiar

      </button>


      <button
        id="btnNuevo"
        class="secondary"
        onclick="nuevoEscaneo()"
      >

        🔄 Escanear de nuevo

      </button>


      <button
        id="btnSalir"
        class="secondary"
        onclick="salir()"
      >

        ✕ Salir

      </button>

    </div>


  </div>


</div>


<script>


/****************************************************
 * VARIABLES
 ****************************************************/

let reader = null;

let controls = null;

let activo = true;

let codigoDetectado = '';

let dispositivoSeleccionado = null;

let streamActual = null;


/****************************************************
 * INICIO
 ****************************************************/

document.addEventListener(
  'DOMContentLoaded',
  iniciar
);


/****************************************************
 * INICIAR
 ****************************************************/

async function iniciar() {

  const status =
    document.getElementById(
      'status'
    );


  try {

    if (
      typeof ZXingBrowser ===
      'undefined'
    ) {

      throw new Error(
        'No se pudo cargar ZXing.'
      );

    }


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Este navegador no permite utilizar la cámara.'
      );

    }


    status.textContent =
      'Solicitando permiso para la cámara...';


    /*
     * Solicitar inicialmente cámara trasera.
     */

    streamActual =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: 'environment'
          },

          width: {
            ideal: 3840
          },

          height: {
            ideal: 2160
          },

          frameRate: {
            ideal: 30
          }

        },

        audio: false

      });


    /*
     * Mostrar resolución REAL obtenida.
     */

    actualizarResolucion(
      streamActual
    );


    /*
     * Detener temporalmente este stream.
     * Después ZXing abrirá el dispositivo.
     */

    detenerStream();


    status.textContent =
      'Buscando cámara...';


    reader =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    const dispositivos =
      await ZXingBrowser
        .BrowserCodeReader
        .listVideoInputDevices();


    if (
      !dispositivos ||
      dispositivos.length === 0
    ) {

      throw new Error(
        'No se encontró ninguna cámara.'
      );

    }


    /*
     * Buscar cámara trasera.
     */

    dispositivoSeleccionado =
      dispositivos[0];


    for (
      const camara of dispositivos
    ) {

      const label =
        String(
          camara.label || ''
        ).toLowerCase();


      if (

        label.includes('back') ||

        label.includes('rear') ||

        label.includes('environment') ||

        label.includes('trasera') ||

        label.includes('posterior')

      ) {

        dispositivoSeleccionado =
          camara;

        break;

      }

    }


    iniciarLectura();


  } catch (error) {

    console.error(
      error
    );


    activo =
      false;


    status.innerHTML =

      '⚠ Cámara no disponible.<br><br>' +

      '<small>' +

      explicarError(error) +

      '</small>';

  }

}


/****************************************************
 * ACTUALIZAR RESOLUCIÓN
 ****************************************************/

function actualizarResolucion(
  stream
) {

  try {

    if (!stream) {

      return;

    }


    const track =
      stream.getVideoTracks()[0];


    if (!track) {

      return;

    }


    const settings =
      track.getSettings();


    const width =
      settings.width || '?';


    const height =
      settings.height || '?';


    document.getElementById(
      'resolutionInfo'
    ).textContent =

      'Cámara disponible: ' +
      width +
      ' × ' +
      height;

  } catch (error) {

    console.warn(
      'No se pudo obtener resolución:',
      error
    );

  }

}


/****************************************************
 * INICIAR LECTURA CONTINUA
 ****************************************************/

async function iniciarLectura() {

  if (!reader) {

    return;

  }


  activo =
    true;


  const status =
    document.getElementById(
      'status'
    );


  status.textContent =
    'Apunte al código de barras o QR...';


  const video =
    document.getElementById(
      'video'
    );


  try {

    controls =
      await reader.decodeFromVideoDevice(

        dispositivoSeleccionado
          ? dispositivoSeleccionado.deviceId
          : undefined,

        video,

        function(
          result,
          error
        ) {

          if (!activo) {

            return;

          }


          if (result) {

            const texto =
              result
                .getText()
                .trim();


            if (texto) {

              codigoDetectado =
                texto;


              mostrarResultado(
                texto
              );

            }

          }

        }

      );


    /*
     * Obtener información de resolución
     * después de iniciar ZXing.
     */

    setTimeout(
      function() {

        try {

          const videoTrack =
            video.srcObject
              ? video.srcObject
                  .getVideoTracks()[0]
              : null;


          if (videoTrack) {

            actualizarResolucion(
              video.srcObject
            );

          }

        } catch (e) {

          console.warn(e);

        }

      },
      800
    );


  } catch (error) {

    console.error(
      error
    );


    status.textContent =
      '⚠ No se pudo iniciar la lectura.';

  }

}


/****************************************************
 * MOSTRAR RESULTADO
 ****************************************************/

async function mostrarResultado(
  codigo
) {

  if (!activo) {

    return;

  }


  activo =
    false;


  detenerCamara();


  codigoDetectado =
    codigo;


  const result =
    document.getElementById(
      'result'
    );


  const resultCode =
    document.getElementById(
      'resultCode'
    );


  const status =
    document.getElementById(
      'status'
    );


  resultCode.textContent =
    codigo;


  result.classList.add(
    'visible'
  );


  status.textContent =
    '✓ Código detectado.';


  document.getElementById(
    'btnCopiar'
  ).disabled = false;


  await copiarAutomaticamente();

}


/****************************************************
 * COPIA AUTOMÁTICA
 ****************************************************/

async function copiarAutomaticamente() {

  if (!codigoDetectado) {

    return;

  }


  try {

    await navigator.clipboard.writeText(
      codigoDetectado
    );


    document.getElementById(
      'status'
    ).textContent =
      '✓ Código detectado y copiado al portapapeles.';


  } catch (error) {

    console.warn(
      'No se pudo copiar automáticamente:',
      error
    );


    document.getElementById(
      'status'
    ).textContent =
      '✓ Código detectado. Pulse "Copiar".';

  }

}


/****************************************************
 * COPIAR RESULTADO
 ****************************************************/

async function copiarResultado() {

  if (!codigoDetectado) {

    return;

  }


  try {

    await navigator.clipboard.writeText(
      codigoDetectado
    );


    document.getElementById(
      'status'
    ).textContent =
      '✓ Código copiado al portapapeles.';


  } catch (error) {

    try {

      const textarea =
        document.createElement(
          'textarea'
        );


      textarea.value =
        codigoDetectado;


      textarea.style.position =
        'fixed';

      textarea.style.opacity =
        '0';


      document.body.appendChild(
        textarea
      );


      textarea.focus();

      textarea.select();


      document.execCommand(
        'copy'
      );


      textarea.remove();


      document.getElementById(
        'status'
      ).textContent =
        '✓ Código copiado.';

    } catch (e) {

      document.getElementById(
        'status'
      ).textContent =
        '⚠ No se pudo copiar automáticamente. Mantenga presionado el código para copiarlo.';

    }

  }

}


/****************************************************
 * TOMAR FOTO EN ALTA RESOLUCIÓN
 ****************************************************/

async function tomarFoto() {

  const video =
    document.getElementById(
      'video'
    );


  const status =
    document.getElementById(
      'status'
    );


  const boton =
    document.getElementById(
      'btnFoto'
    );


  if (!video) {

    return;

  }


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    status.textContent =
      '⚠ La cámara todavía no está lista.';

    return;

  }


  boton.disabled =
    true;


  activo =
    false;


  status.textContent =
    '📸 Preparando captura de alta resolución...';


  /*
   * Detener el lector actual.
   */

  detenerCamara();


  try {

    /*
     * Abrir una cámara independiente
     * específicamente para realizar
     * la fotografía.
     */

    const streamFoto =
      await abrirCamaraAltaResolucion();


    const track =
      streamFoto.getVideoTracks()[0];


    if (!track) {

      throw new Error(
        'No se pudo obtener la cámara.'
      );

    }


    /*
     * Esperar un momento para que la cámara
     * estabilice exposición y enfoque.
     */

    status.textContent =
      '📷 Enfocando y preparando fotografía...';


    await esperar(
      700
    );


    /*
     * Obtener resolución real.
     */

    const settings =
      track.getSettings();


    const width =
      settings.width ||
      video.videoWidth;


    const height =
      settings.height ||
      video.videoHeight;


    document.getElementById(
      'resolutionInfo'
    ).textContent =

      'Fotografía: ' +
      width +
      ' × ' +
      height;


    /*
     * Crear canvas EXACTAMENTE con la
     * resolución que entrega la cámara.
     */

    const canvas =
      document.getElementById(
        'canvas'
      );


    canvas.width =
      width;

    canvas.height =
      height;


    const ctx =
      canvas.getContext(
        '2d',
        {
          alpha: false,
          desynchronized: false
        }
      );


    /*
     * Si ImageCapture está disponible,
     * utilizar la captura fotográfica
     * nativa del dispositivo.
     */

    if (
      typeof ImageCapture !==
      'undefined'
    ) {

      try {

        const imageCapture =
          new ImageCapture(
            track
          );


        const photo =
          await imageCapture.takePhoto();


        /*
         * Dibujar la fotografía nativa.
         */

        const bitmap =
          await createImageBitmap(
            photo
          );


        canvas.width =
          bitmap.width;

        canvas.height =
          bitmap.height;


        ctx.drawImage(
          bitmap,
          0,
          0,
          bitmap.width,
          bitmap.height
        );


        if (
          bitmap.close
        ) {

          bitmap.close();

        }


      } catch (imageCaptureError) {

        console.warn(
          'ImageCapture no disponible, usando frame del video:',
          imageCaptureError
        );


        /*
         * Fallback: captura directa
         * del video en resolución real.
         */

        capturarDesdeVideo(
          video,
          canvas,
          ctx
        );

      }

    } else {

      capturarDesdeVideo(
        video,
        canvas,
        ctx
      );

    }


    /*
     * Convertir a JPEG de alta calidad.
     */

    const dataUrl =
      canvas.toDataURL(
        'image/jpeg',
        0.98
      );


    /*
     * Mostrar fotografía capturada.
     */

    const image =
      document.getElementById(
        'capturedImage'
      );


    image.src =
      dataUrl;


    document
      .getElementById(
        'photoArea'
      )
      .classList.add(
        'visible'
      );


    /*
     * Cerrar cámara fotográfica.
     */

    streamFoto
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    /*
     * Analizar fotografía COMPLETA.
     */

    status.textContent =
      '🔎 Analizando fotografía completa...';


    await analizarImagenAltaResolucion(
      dataUrl
    );


  } catch (error) {

    console.error(
      'Error capturando fotografía:',
      error
    );


    status.textContent =
      '⚠ No se pudo realizar la fotografía: ' +
      (error.message || error);


  } finally {

    boton.disabled =
      false;

  }

}


/****************************************************
 * ABRIR CÁMARA PARA FOTOGRAFÍA
 ****************************************************/

async function abrirCamaraAltaResolucion() {

  /*
   * Primero solicitamos una resolución
   * muy alta.
   */

  const restricciones = {

    video: {

      facingMode: {
        ideal: 'environment'
      },

      width: {
        ideal: 3840
      },

      height: {
        ideal: 2160
      },

      frameRate: {
        ideal: 30
      }

    },

    audio: false

  };


  try {

    const stream =
      await navigator.mediaDevices
        .getUserMedia(
          restricciones
        );


    const track =
      stream.getVideoTracks()[0];


    /*
     * Consultar capacidades reales.
     */

    if (
      track &&
      track.getCapabilities
    ) {

      const capabilities =
        track.getCapabilities();


      const widthMax =
        capabilities.width &&
        capabilities.width.max
          ? capabilities.width.max
          : null;


      const heightMax =
        capabilities.height &&
        capabilities.height.max
          ? capabilities.height.max
          : null;


      /*
       * Si el navegador informa máximos,
       * solicitar esos máximos.
       */

      if (
        widthMax &&
        heightMax
      ) {

        try {

          await track.applyConstraints({

            width: {
              ideal: widthMax
            },

            height: {
              ideal: heightMax
            },

            frameRate: {
              ideal: 30
            }

          });

        } catch (constraintError) {

          console.warn(
            'No se pudieron aplicar máximos:',
            constraintError
          );

        }

      }

    }


    actualizarResolucion(
      stream
    );


    return stream;


  } catch (error) {

    /*
     * Segundo intento más compatible.
     */

    console.warn(
      'No se pudo abrir cámara alta:',
      error
    );


    return await navigator.mediaDevices
      .getUserMedia({

        video: {

          facingMode: {
            ideal: 'environment'
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });

  }

}


/****************************************************
 * CAPTURAR DESDE VIDEO
 ****************************************************/

function capturarDesdeVideo(
  video,
  canvas,
  ctx
) {

  const width =
    video.videoWidth;


  const height =
    video.videoHeight;


  canvas.width =
    width;


  canvas.height =
    height;


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );

}


/****************************************************
 * ANALIZAR IMAGEN DE ALTA RESOLUCIÓN
 ****************************************************/

async function analizarImagenAltaResolucion(
  dataUrl
) {

  const status =
    document.getElementById(
      'status'
    );


  try {

    /*
     * Cargar imagen.
     */

    const img =
      await cargarImagen(
        dataUrl
      );


    /*
     * No reducimos inmediatamente la fotografía.
     *
     * Primero intentamos analizarla completa.
     */

    status.textContent =
      '🔎 Intento 1/6: analizando imagen original...';


    let resultado =
      await intentarDecodificarCanvas(
        img,
        1,
        false
      );


    if (resultado) {

      mostrarResultado(
        resultado
      );

      return;

    }


    /*
     * Segundo intento:
     * escala de grises + contraste.
     */

    status.textContent =
      '🔎 Intento 2/6: mejorando contraste...';


    resultado =
      await intentarDecodificarCanvas(
        img,
        1,
        true
      );


    if (resultado) {

      mostrarResultado(
        resultado
      );

      return;

    }


    /*
     * Tercer intento:
     * imagen reducida moderadamente.
     *
     * Algunas cámaras producen imágenes
     * demasiado grandes para el decoder.
     */

    status.textContent =
      '🔎 Intento 3/6: optimizando resolución...';


    resultado =
      await intentarDecodificarCanvas(
        img,
        0.75,
        false
      );


    if (resultado) {

      mostrarResultado(
        resultado
      );

      return;

    }


    /*
     * Cuarto intento:
     * escala 0.75 + contraste.
     */

    status.textContent =
      '🔎 Intento 4/6: procesando contraste...';


    resultado =
      await intentarDecodificarCanvas(
        img,
        0.75,
        true
      );


    if (resultado) {

      mostrarResultado(
        resultado
      );

      return;

    }


    /*
     * Quinto intento:
     * reducir más para códigos muy pequeños.
     */

    status.textContent =
      '🔎 Intento 5/6: buscando códigos pequeños...';


    resultado =
      await intentarDecodificarCanvas(
        img,
        0.5,
        false
      );


    if (resultado) {

      mostrarResultado(
        resultado
      );

      return;

    }


    /*
     * Sexto intento:
     * escala pequeña + contraste.
     */

    status.textContent =
      '🔎 Intento 6/6: último análisis...';


    resultado =
      await intentarDecodificarCanvas(
        img,
        0.5,
        true
      );


    if (resultado) {

      mostrarResultado(
        resultado
      );

      return;

    }


    /*
     * No encontrado.
     */

    activo =
      false;


    status.textContent =
      '⚠ No se encontró ningún código. ' +
      'Acerque el código, mejore la iluminación y vuelva a tomar la foto.';


  } catch (error) {

    console.error(
      'Error analizando imagen:',
      error
    );


    activo =
      false;


    status.textContent =
      '⚠ No se pudo analizar la fotografía. ' +
      (error.message || '');

  }

}


/****************************************************
 * INTENTAR DECODIFICAR CANVAS
 ****************************************************/

async function intentarDecodificarCanvas(
  img,
  escala,
  mejorar
) {

  try {

    const canvas =
      document.createElement(
        'canvas'
      );


    let width =
      Math.round(
        img.width *
        escala
      );


    let height =
      Math.round(
        img.height *
        escala
      );


    /*
     * Limitar únicamente si la imagen
     * es exageradamente grande.
     *
     * 3000 px es suficiente para ZXing
     * y evita problemas de memoria.
     */

    const maxDimension =
      3000;


    if (
      width >
      maxDimension ||
      height >
      maxDimension
    ) {

      const factor =
        Math.min(
          maxDimension / width,
          maxDimension / height
        );


      width =
        Math.round(
          width *
          factor
        );


      height =
        Math.round(
          height *
          factor
        );

    }


    canvas.width =
      width;


    canvas.height =
      height;


    const ctx =
      canvas.getContext(
        '2d',
        {
          willReadFrequently: true
        }
      );


    /*
     * Dibujar imagen.
     */

    ctx.drawImage(
      img,
      0,
      0,
      width,
      height
    );


    /*
     * Opcionalmente mejorar contraste.
     */

    if (mejorar) {

      mejorarImagen(
        ctx,
        width,
        height
      );

    }


    /*
     * Convertir canvas a Blob/Data URL.
     */

    const dataUrl =
      canvas.toDataURL(
        'image/jpeg',
        0.95
      );


    /*
     * Crear un lector nuevo para cada
     * intento.
     */

    const lector =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    /*
     * Analizar imagen completa.
     */

    const resultado =
      await lector
        .decodeFromImageUrl(
          dataUrl
        );


    if (
      resultado &&
      resultado.getText()
    ) {

      return resultado
        .getText()
        .trim();

    }


  } catch (error) {

    console.warn(
      'Intento de decodificación fallido:',
      error
    );

  }


  return null;

}


/****************************************************
 * MEJORAR IMAGEN
 ****************************************************/

function mejorarImagen(
  ctx,
  width,
  height
) {

  try {

    const imageData =
      ctx.getImageData(
        0,
        0,
        width,
        height
      );


    const data =
      imageData.data;


    /*
     * Conversión a escala de grises
     * + aumento moderado de contraste.
     */

    const contraste =
      1.35;


    const factor =
      (
        259 *
        (
          contraste + 255
        )
      ) /
      (
        255 *
        (
          259 - contraste
        )
      );


    for (
      let i = 0;
      i < data.length;
      i += 4
    ) {

      const r =
        data[i];


      const g =
        data[i + 1];


      const b =
        data[i + 2];


      const gris =
        (
          0.299 * r +
          0.587 * g +
          0.114 * b
        );


      let nuevo =
        factor *
        (
          gris - 128
        ) +
        128;


      nuevo =
        Math.max(
          0,
          Math.min(
            255,
            nuevo
          )
        );


      data[i] =
        nuevo;


      data[i + 1] =
        nuevo;


      data[i + 2] =
        nuevo;

    }


    ctx.putImageData(
      imageData,
      0,
      0
    );


  } catch (error) {

    console.warn(
      'No se pudo mejorar la imagen:',
      error
    );

  }

}


/****************************************************
 * CARGAR IMAGEN
 ****************************************************/

function cargarImagen(
  dataUrl
) {

  return new Promise(
    function(resolve, reject) {

      const img =
        new Image();


      img.onload =
        function() {

          resolve(
            img
          );

        };


      img.onerror =
        function(error) {

          reject(
            new Error(
              'No se pudo cargar la fotografía.'
            )
          );

        };


      img.src =
        dataUrl;

    }
  );

}


/****************************************************
 * ESPERAR
 ****************************************************/

function esperar(
  milisegundos
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        milisegundos
      );

    }
  );

}


/****************************************************
 * NUEVO ESCANEO
 ****************************************************/

async function nuevoEscaneo() {

  codigoDetectado =
    '';


  activo =
    true;


  document
    .getElementById(
      'result'
    )
    .classList.remove(
      'visible'
    );


  document
    .getElementById(
      'photoArea'
    )
    .classList.remove(
      'visible'
    );


  document.getElementById(
    'btnCopiar'
  ).disabled = true;


  document.getElementById(
    'btnFoto'
  ).disabled = false;


  document.getElementById(
    'status'
  ).textContent =
    'Reiniciando cámara...';


  /*
   * Volver a detectar cámara.
   */

  try {

    if (!reader) {

      reader =
        new ZXingBrowser
          .BrowserMultiFormatReader();

    }


    iniciarLectura();

  } catch (error) {

    console.error(
      error
    );


    document.getElementById(
      'status'
    ).textContent =
      '⚠ No se pudo reiniciar la cámara.';

  }

}


/****************************************************
 * DETENER STREAM
 ****************************************************/

function detenerStream() {

  if (
    streamActual
  ) {

    streamActual
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    streamActual =
      null;

  }

}


/****************************************************
 * DETENER CÁMARA
 ****************************************************/

function detenerCamara() {

  if (controls) {

    try {

      controls.stop();

    } catch (e) {

      console.log(e);

    }

    controls =
      null;

  }


  if (reader) {

    try {

      reader.reset();

    } catch (e) {

      console.log(e);

    }

  }


  detenerStream();


  const video =
    document.getElementById(
      'video'
    );


  if (
    video &&
    video.srcObject
  ) {

    video.srcObject
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    video.srcObject =
      null;

  }

}


/****************************************************
 * SALIR
 ****************************************************/

function salir() {

  activo =
    false;


  detenerCamara();


  /*
   * Intentamos cerrar la pestaña.
   */

  window.close();


  /*
   * Si el navegador no permite cerrar
   * la pestaña, mostramos mensaje.
   */

  setTimeout(
    function() {

      document.getElementById(
        'status'
      ).textContent =
        'Puede cerrar esta pestaña manualmente. El código permanece en el portapapeles.';

    },
    300
  );

}


/****************************************************
 * EXPLICAR ERROR
 ****************************************************/

function explicarError(error) {

  if (!error) {

    return 'Error desconocido.';

  }


  const nombre =
    error.name || '';


  if (
    nombre ===
    'NotAllowedError'
  ) {

    return (
      'El navegador no permitió el acceso a la cámara. ' +
      'Revise el permiso de cámara para esta página.'
    );

  }


  if (
    nombre ===
    'NotFoundError'
  ) {

    return (
      'No se encontró una cámara disponible.'
    );

  }


  if (
    nombre ===
    'NotReadableError'
  ) {

    return (
      'La cámara está siendo utilizada por otra aplicación.'
    );

  }


  if (
    nombre ===
    'SecurityError'
  ) {

    return (
      'El navegador bloqueó el acceso a la cámara por seguridad.'
    );

  }


  return (
    error.message ||
    String(error)
  );

}


/****************************************************
 * LIMPIEZA
 ****************************************************/

window.addEventListener(
  'pagehide',
  function() {

    activo =
      false;

    detenerCamara();

  }
);

</script>
