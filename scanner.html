<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Escáner de Inventario
  </title>


  <!-- ZXing -->

  <script
    src="https://unpkg.com/@zxing/browser@latest"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #111;

      color: white;

    }


    body {

      overflow: hidden;

    }


    .app {

      width: 100%;

      height: 100vh;

      min-height: 100vh;

      display: flex;

      flex-direction: column;

    }


    /**********************************************
     * HEADER
     **********************************************/

    .header {

      padding: 14px;

      background: #202124;

      text-align: center;

      flex-shrink: 0;

    }


    .header h1 {

      margin: 0;

      font-size: 20px;

    }


    .header p {

      margin: 6px 0 0;

      color: #b8b8b8;

      font-size: 13px;

    }


    /**********************************************
     * SCANNER
     **********************************************/

    .scanner {

      flex: 1;

      min-height: 0;

      display: flex;

      flex-direction: column;

    }


    .video-container {

      position: relative;

      flex: 1;

      min-height: 0;

      background: black;

      overflow: hidden;

    }


    #video {

      width: 100%;

      height: 100%;

      object-fit: cover;

    }


    /**********************************************
     * MARCO
     **********************************************/

    .frame {

      position: absolute;

      top: 50%;

      left: 50%;

      width: 88%;

      height: 30%;

      transform:
        translate(-50%, -50%);

      border:
        2px solid
        rgba(255,255,255,.25);

      pointer-events: none;

    }


    .corner {

      position: absolute;

      width: 35px;

      height: 35px;

      border-color: #00ff88;

      border-style: solid;

    }


    .top-left {

      top: -2px;

      left: -2px;

      border-width:
        5px 0 0 5px;

    }


    .top-right {

      top: -2px;

      right: -2px;

      border-width:
        5px 5px 0 0;

    }


    .bottom-left {

      bottom: -2px;

      left: -2px;

      border-width:
        0 0 5px 5px;

    }


    .bottom-right {

      bottom: -2px;

      right: -2px;

      border-width:
        0 5px 5px 0;

    }


    .line {

      position: absolute;

      left: 0;

      right: 0;

      top: 50%;

      height: 2px;

      background: #00ff88;

      box-shadow:
        0 0 8px
        rgba(0,255,136,.8);

      animation:
        scan 1.5s infinite;

    }


    @keyframes scan {

      0% {
        transform: translateY(-55px);
      }

      50% {
        transform: translateY(55px);
      }

      100% {
        transform: translateY(-55px);
      }

    }


    /**********************************************
     * STATUS
     **********************************************/

    .status {

      padding: 13px;

      text-align: center;

      background: #202124;

      font-size: 14px;

      font-weight: 600;

      flex-shrink: 0;

      min-height: 48px;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    /**********************************************
     * RESULTADO
     **********************************************/

    .result {

      display: none;

      padding: 15px;

      background: #0b8043;

      text-align: center;

      flex-shrink: 0;

    }


    .result.visible {

      display: block;

    }


    .result-title {

      font-size: 13px;

      margin-bottom: 7px;

      opacity: .9;

    }


    .result-code {

      background: rgba(0,0,0,.25);

      border-radius: 8px;

      padding: 12px;

      font-size: 18px;

      font-weight: 700;

      word-break: break-all;

      user-select: text;

      -webkit-user-select: text;

    }


    .copy-status {

      margin-top: 8px;

      font-size: 12px;

    }


    /**********************************************
     * ACTIONS
     **********************************************/

    .actions {

      padding: 10px;

      background: #202124;

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 8px;

      flex-shrink: 0;

    }


    button {

      width: 100%;

      min-height: 46px;

      border: none;

      border-radius: 9px;

      background: #1a73e8;

      color: white;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

      padding: 8px;

    }


    button:disabled {

      opacity: .5;

      cursor: not-allowed;

    }


    button.green {

      background: #0f9d58;

    }


    button.dark {

      background: #3c4043;

    }


    button.orange {

      background: #f9ab00;

      color: #202124;

    }


    /**********************************************
     * FOTO
     **********************************************/

    #fotoInput {

      display: none;

    }


    /**********************************************
     * AYUDA
     **********************************************/

    .help {

      padding: 9px 12px;

      background: #171717;

      color: #b8b8b8;

      font-size: 11px;

      text-align: center;

      line-height: 1.4;

    }


    /**********************************************
     * MOBILE
     **********************************************/

    @media (max-width: 500px) {

      .header {

        padding: 11px;

      }


      .header h1 {

        font-size: 18px;

      }


      .header p {

        font-size: 12px;

      }


      .frame {

        width: 92%;

        height: 28%;

      }


      .actions {

        grid-template-columns:
          repeat(2, 1fr);

      }


      button {

        font-size: 13px;

      }

    }

  </style>

</head>


<body>


<div class="app">


  <!-- ==========================================
       HEADER
       ========================================== -->

  <div class="header">

    <h1>
      📷 Escáner de inventario
    </h1>

    <p>
      Barras y códigos QR
    </p>

  </div>


  <!-- ==========================================
       SCANNER
       ========================================== -->

  <div class="scanner">


    <div class="video-container">


      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>


      <div class="frame">

        <div class="corner top-left"></div>

        <div class="corner top-right"></div>

        <div class="corner bottom-left"></div>

        <div class="corner bottom-right"></div>

        <div class="line"></div>

      </div>


    </div>


    <!-- ========================================
         ESTADO
         ======================================== -->

    <div
      id="status"
      class="status"
    >

      Iniciando cámara...

    </div>


    <!-- ========================================
         RESULTADO
         ======================================== -->

    <div
      id="resultado"
      class="result"
    >

      <div class="result-title">

        ✓ Código detectado

      </div>


      <div
        id="codigoResultado"
        class="result-code"
      ></div>


      <div
        id="copyStatus"
        class="copy-status"
      >

        Intentando copiar...

      </div>

    </div>


    <!-- ========================================
         AYUDA
         ======================================== -->

    <div class="help">

      Acerque el código al marco.
      Mantenga el teléfono estable.
      Si no lo reconoce, use "Tomar foto".

    </div>


    <!-- ========================================
         BOTONES
         ======================================== -->

    <div class="actions">


      <button
        id="btnCopiar"
        class="green"
        onclick="copiarResultado()"
        disabled
      >

        📋 Copiar código

      </button>


      <button
        id="btnFoto"
        class="orange"
        onclick="abrirCamaraFoto()"
      >

        📸 Tomar foto

      </button>


      <button
        id="btnLinterna"
        class="dark"
        onclick="alternarLinterna()"
      >

        🔦 Linterna

      </button>


      <button
        id="btnCancelar"
        class="dark"
        onclick="cancelar()"
      >

        ← Volver

      </button>


    </div>


  </div>


</div>


<!-- ============================================
     INPUT PARA FOTO
     ============================================ -->

<input
  type="file"
  id="fotoInput"
  accept="image/*"
  capture="environment"
>


<script>


/****************************************************
 * VARIABLES
 ****************************************************/

let reader = null;

let controls = null;

let activo = true;

let codigoDetectado = '';

let videoStream = null;

let trackCamara = null;

let procesandoResultado = false;


/****************************************************
 * INICIO
 ****************************************************/

document.addEventListener(
  'DOMContentLoaded',
  iniciar
);


/****************************************************
 * INICIAR
 ****************************************************/

async function iniciar() {

  const status =
    document.getElementById(
      'status'
    );


  try {

    status.textContent =
      'Solicitando permiso para la cámara...';


    /*
     * Comprobamos cámara.
     */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Este navegador no permite utilizar la cámara.'
      );

    }


    /*
     * Creamos ZXing.
     */

    if (
      typeof ZXingBrowser ===
      'undefined'
    ) {

      throw new Error(
        'No se pudo cargar el lector ZXing.'
      );

    }


    reader =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    /*
     * Pedimos cámara.
     */

    videoStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: 'environment'
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            },

            focusMode: 'continuous'

          },

          audio: false

        });


    /*
     * Guardamos el track para
     * controlar la linterna.
     */

    const tracks =
      videoStream.getVideoTracks();


    if (
      tracks &&
      tracks.length > 0
    ) {

      trackCamara =
        tracks[0];

    }


    /*
     * Mostrar video.
     */

    const video =
      document.getElementById(
        'video'
      );


    video.srcObject =
      videoStream;


    await video.play();


    status.textContent =
      'Buscando código de barras o QR...';


    /*
     * Ahora ZXing utilizará la cámara.
     */

    iniciarZXing();

  } catch (error) {

    console.error(
      error
    );


    activo =
      false;


    status.innerHTML =

      '⚠ Cámara no disponible.<br><br>' +

      '<small>' +

      explicarError(error) +

      '</small>';

  }

}


/****************************************************
 * INICIAR ZXING
 ****************************************************/

async function iniciarZXing() {

  const video =
    document.getElementById(
      'video'
    );


  try {

    /*
     * Dejamos que ZXing seleccione
     * el dispositivo que ya tenemos.
     */

    const dispositivos =
      await ZXingBrowser
        .BrowserCodeReader
        .listVideoInputDevices();


    if (
      !dispositivos ||
      dispositivos.length === 0
    ) {

      throw new Error(
        'No se encontró ninguna cámara.'
      );

    }


    /*
     * Buscar cámara trasera.
     */

    let dispositivo =
      dispositivos[0];


    for (
      const camara
      of dispositivos
    ) {

      const label =
        String(
          camara.label || ''
        ).toLowerCase();


      if (

        label.includes('back') ||

        label.includes('rear') ||

        label.includes('environment') ||

        label.includes('trasera') ||

        label.includes('posterior')

      ) {

        dispositivo =
          camara;

        break;

      }

    }


    /*
     * ZXing inicia su propio stream.
     */

    controls =
      await reader
        .decodeFromVideoDevice(

          dispositivo.deviceId,

          video,

          function(
            result,
            error
          ) {

            if (!activo) {

              return;

            }


            if (
              procesandoResultado
            ) {

              return;

            }


            if (result) {

              const texto =
                result
                  .getText()
                  .trim();


              if (texto) {

                procesarCodigo(
                  texto
                );

              }

            }

          }

        );

  } catch (error) {

    console.error(
      error
    );


    document
      .getElementById(
        'status'
      )
      .textContent =
      '⚠ No fue posible iniciar el lector.';

  }

}


/****************************************************
 * PROCESAR CÓDIGO
 ****************************************************/

function procesarCodigo(
  codigo
) {

  if (
    !codigo ||
    procesandoResultado
  ) {

    return;

  }


  procesandoResultado =
    true;


  codigoDetectado =
    String(codigo).trim();


  activo =
    false;


  /*
   * Detener lector.
   */

  detenerCamara();


  /*
   * Mostrar resultado.
   */

  const resultado =
    document.getElementById(
      'resultado'
    );


  const codigoElemento =
    document.getElementById(
      'codigoResultado'
    );


  const copyStatus =
    document.getElementById(
      'copyStatus'
    );


  codigoElemento.textContent =
    codigoDetectado;


  resultado.classList.add(
    'visible'
  );


  document
    .getElementById(
      'btnCopiar'
    )
    .disabled =
    false;


  document
    .getElementById(
      'status'
    )
    .textContent =
    '✓ Código leído correctamente';


  /*
   * Intento automático de portapapeles.
   */

  copiarAutomaticamente()
    .then(
      function(ok) {

        if (ok) {

          copyStatus.textContent =
            '✓ Copiado al portapapeles. Vuelva al formulario y pegue el código.';

        } else {

          copyStatus.textContent =
            'Toque "Copiar código" y luego vuelva al formulario.';

        }

      }
    );

}


/****************************************************
 * COPIA AUTOMÁTICA
 ****************************************************/

async function copiarAutomaticamente() {

  if (
    !codigoDetectado
  ) {

    return false;

  }


  try {

    if (
      navigator.clipboard &&
      navigator.clipboard.writeText
    ) {

      await navigator.clipboard.writeText(
        codigoDetectado
      );

      return true;

    }

  } catch (error) {

    console.log(
      'Copia automática bloqueada:',
      error
    );

  }


  return false;

}


/****************************************************
 * COPIAR RESULTADO
 ****************************************************/

async function copiarResultado() {

  if (
    !codigoDetectado
  ) {

    return;

  }


  const copyStatus =
    document.getElementById(
      'copyStatus'
    );


  try {

    /*
     * Esta función se ejecuta
     * directamente por un clic del usuario,
     * por lo que tiene muchas más posibilidades
     * de ser aceptada por el navegador.
     */

    await navigator.clipboard.writeText(
      codigoDetectado
    );


    copyStatus.textContent =
      '✓ Código copiado. Ahora puede volver al formulario y pegarlo.';


    document
      .getElementById(
        'btnCopiar'
      )
      .textContent =
      '✓ Copiado';


    setTimeout(
      function() {

        document
          .getElementById(
            'btnCopiar'
          )
          .textContent =
          '📋 Copiar código';

      },
      2000
    );


  } catch (error) {

    console.error(
      error
    );


    /*
     * Método alternativo para navegadores
     * que bloqueen Clipboard API.
     */

    copiarAlternativo();

  }

}


/****************************************************
 * COPIA ALTERNATIVA
 ****************************************************/

function copiarAlternativo() {

  const textarea =
    document.createElement(
      'textarea'
    );


  textarea.value =
    codigoDetectado;


  textarea.style.position =
    'fixed';

  textarea.style.left =
    '-9999px';

  textarea.style.top =
    '0';


  document
    .body
    .appendChild(
      textarea
    );


  textarea.focus();

  textarea.select();


  let correcto =
    false;


  try {

    correcto =
      document.execCommand(
        'copy'
      );

  } catch (error) {

    console.error(
      error
    );

  }


  document
    .body
    .removeChild(
      textarea
    );


  const copyStatus =
    document.getElementById(
      'copyStatus'
    );


  if (correcto) {

    copyStatus.textContent =
      '✓ Código copiado.';

  } else {

    copyStatus.textContent =
      'No se pudo copiar automáticamente. Mantenga presionado el código para copiarlo manualmente.';

  }

}


/****************************************************
 * TOMAR FOTO
 ****************************************************/

function abrirCamaraFoto() {

  /*
   * Volvemos a permitir la captura.
   */

  const input =
    document.getElementById(
      'fotoInput'
    );


  input.value =
    '';


  input.click();

}


/****************************************************
 * PROCESAR FOTO
 ****************************************************/

document
  .getElementById(
    'fotoInput'
  )
  .addEventListener(
    'change',
    procesarFoto
  );


async function procesarFoto(event) {

  const archivo =
    event.target.files &&
    event.target.files[0];


  if (!archivo) {

    return;

  }


  const status =
    document.getElementById(
      'status'
    );


  status.textContent =
    '🔍 Analizando fotografía...';


  try {

    /*
     * Crear imagen.
     */

    const url =
      URL.createObjectURL(
        archivo
      );


    const imagen =
      new Image();


    imagen.onload =
      async function() {

        try {

          /*
           * Intentar leer directamente
           * la fotografía con ZXing.
           */

          const resultado =
            await reader
              .decodeFromImageElement(
                imagen
              );


          if (
            resultado
          ) {

            const texto =
              resultado
                .getText()
                .trim();


            if (texto) {

              procesarCodigo(
                texto
              );


              URL.revokeObjectURL(
                url
              );


              return;

            }

          }


          throw new Error(
            'No se encontró ningún código.'
          );

        } catch (error) {

          console.error(
            error
          );


          status.innerHTML =
            '⚠ No se encontró un código.<br>' +
            '<small>' +
            'Intente tomar otra foto acercándose más al código y evitando reflejos.' +
            '</small>';


          /*
           * Volvemos a activar cámara.
           */

          activo =
            true;


          procesandoResultado =
            false;


          URL.revokeObjectURL(
            url
          );

          iniciar();

        }

      };


    imagen.onerror =
      function() {

        status.textContent =
          '⚠ No se pudo abrir la fotografía.';

        URL.revokeObjectURL(
          url
        );

      };


    imagen.src =
      url;

  } catch (error) {

    console.error(
      error
    );


    status.textContent =
      '⚠ Error analizando la fotografía.';

  }

}


/****************************************************
 * LINTERNA
 ****************************************************/

async function alternarLinterna() {

  if (!trackCamara) {

    alert(
      'La linterna no está disponible en este momento.'
    );

    return;

  }


  try {

    const capacidades =
      trackCamara.getCapabilities();


    if (
      !capacidades.torch
    ) {

      alert(
        'El navegador o dispositivo no permite controlar la linterna desde esta página.'
      );

      return;

    }


    const estadoActual =
      trackCamara
        .getSettings()
        .torch || false;


    await trackCamara.applyConstraints({

      advanced: [
        {
          torch: !estadoActual
        }
      ]

    });


    document
      .getElementById(
        'btnLinterna'
      )
      .textContent =
      estadoActual
        ? '🔦 Linterna'
        : '💡 Linterna ON';


  } catch (error) {

    console.error(
      error
    );


    alert(
      'No fue posible controlar la linterna.'
    );

  }

}


/****************************************************
 * DETENER CÁMARA
 ****************************************************/

function detenerCamara() {

  /*
   * Detener ZXing.
   */

  if (controls) {

    try {

      controls.stop();

    } catch (error) {

      console.log(
        error
      );

    }

    controls =
      null;

  }


  /*
   * Reset ZXing.
   */

  if (reader) {

    try {

      reader.reset();

    } catch (error) {

      console.log(
        error
      );

    }

  }


  /*
   * Detener stream.
   */

  if (videoStream) {

    videoStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    videoStream =
      null;

  }


  /*
   * Limpiar video.
   */

  const video =
    document.getElementById(
      'video'
    );


  if (
    video &&
    video.srcObject
  ) {

    try {

      video.srcObject
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );

    } catch (error) {

      console.log(
        error
      );

    }


    video.srcObject =
      null;

  }


  trackCamara =
    null;

}


/****************************************************
 * CANCELAR
 ****************************************************/

function cancelar() {

  activo =
    false;


  procesandoResultado =
    false;


  detenerCamara();


  /*
   * No intentamos cerrar la pestaña
   * porque los navegadores móviles
   * normalmente lo bloquean.
   */

  window.history.back();

}


/****************************************************
 * ERRORES
 ****************************************************/

function explicarError(error) {

  if (!error) {

    return 'Error desconocido.';

  }


  const nombre =
    error.name || '';


  if (
    nombre ===
    'NotAllowedError'
  ) {

    return (
      'El navegador no permitió el acceso a la cámara. ' +
      'Revise los permisos de cámara para esta página.'
    );

  }


  if (
    nombre ===
    'NotFoundError'
  ) {

    return (
      'No se encontró una cámara disponible.'
    );

  }


  if (
    nombre ===
    'NotReadableError'
  ) {

    return (
      'La cámara está siendo utilizada por otra aplicación.'
    );

  }


  if (
    nombre ===
    'OverconstrainedError'
  ) {

    return (
      'La cámara no soporta la configuración solicitada.'
    );

  }


  return (
    error.message ||
    String(error)
  );

}

</script>


</body>

</html>
