<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Escáner de Inventario
  </title>


  <!--
    ZXing Browser

    Esta librería permite leer:

    - Code 128
    - Code 39
    - EAN-13
    - EAN-8
    - UPC
    - ITF
    - QR
    - y otros formatos
  -->

  <script
    src="https://unpkg.com/@zxing/browser@latest"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

      overflow: hidden;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #111;

      color: white;

    }


    .app {

      width: 100%;

      height: 100vh;

      display: flex;

      flex-direction: column;

      background: #111;

    }


    /***********************************************
     * HEADER
     ***********************************************/

    .header {

      flex: 0 0 auto;

      padding: 16px;

      background: #202124;

      text-align: center;

      border-bottom:
        1px solid #333;

    }


    .header h1 {

      margin: 0;

      font-size: 20px;

    }


    .header p {

      margin: 6px 0 0;

      color: #b8b8b8;

      font-size: 13px;

    }


    /***********************************************
     * ESCANER
     ***********************************************/

    .scanner {

      flex: 1;

      min-height: 0;

      display: flex;

      flex-direction: column;

    }


    .video-container {

      position: relative;

      flex: 1;

      min-height: 0;

      background: black;

      overflow: hidden;

    }


    #video {

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      object-fit: cover;

      background: black;

    }


    /***********************************************
     * MARCO
     ***********************************************/

    .frame {

      position: absolute;

      top: 50%;

      left: 50%;

      width: 86%;

      height: 28%;

      transform:
        translate(-50%, -50%);

      border:
        2px solid
        rgba(255,255,255,.25);

      pointer-events: none;

      border-radius: 6px;

    }


    .corner {

      position: absolute;

      width: 32px;

      height: 32px;

      border-color: #00ff88;

      border-style: solid;

    }


    .top-left {

      top: -2px;

      left: -2px;

      border-width:
        5px 0 0 5px;

    }


    .top-right {

      top: -2px;

      right: -2px;

      border-width:
        5px 5px 0 0;

    }


    .bottom-left {

      bottom: -2px;

      left: -2px;

      border-width:
        0 0 5px 5px;

    }


    .bottom-right {

      bottom: -2px;

      right: -2px;

      border-width:
        0 5px 5px 0;

    }


    .line {

      position: absolute;

      left: 0;

      right: 0;

      top: 50%;

      height: 2px;

      background: #00ff88;

      box-shadow:
        0 0 8px #00ff88;

      animation:
        scan 1.8s infinite;

    }


    @keyframes scan {

      0% {

        transform:
          translateY(-45px);

      }

      50% {

        transform:
          translateY(45px);

      }

      100% {

        transform:
          translateY(-45px);

      }

    }


    /***********************************************
     * INDICADOR DE TIPO
     ***********************************************/

    .format {

      position: absolute;

      top: 15px;

      left: 50%;

      transform:
        translateX(-50%);

      background:
        rgba(0,0,0,.65);

      padding: 7px 12px;

      border-radius: 20px;

      font-size: 12px;

      font-weight: 600;

      pointer-events: none;

    }


    /***********************************************
     * STATUS
     ***********************************************/

    .status {

      flex: 0 0 auto;

      padding: 15px;

      text-align: center;

      background: #202124;

      font-size: 14px;

      font-weight: 600;

      line-height: 1.4;

      min-height: 62px;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    /***********************************************
     * BOTON
     ***********************************************/

    .actions {

      flex: 0 0 auto;

      padding: 14px;

      background: #202124;

    }


    button {

      width: 100%;

      height: 48px;

      border: none;

      border-radius: 10px;

      background: #1a73e8;

      color: white;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

    }


    button:active {

      transform:
        scale(.98);

    }


    button:disabled {

      opacity: .5;

      cursor: not-allowed;

    }


    /***********************************************
     * RESULTADO
     ***********************************************/

    .result {

      position: absolute;

      left: 50%;

      top: 50%;

      transform:
        translate(-50%, -50%);

      width: 90%;

      max-width: 500px;

      padding: 22px;

      border-radius: 14px;

      background:
        rgba(0,0,0,.88);

      text-align: center;

      display: none;

      z-index: 20;

    }


    .result.visible {

      display: block;

    }


    .result-title {

      font-size: 18px;

      font-weight: 700;

      margin-bottom: 12px;

      color: #00ff88;

    }


    .result-code {

      font-size: 20px;

      font-weight: 700;

      word-break: break-all;

      margin-bottom: 15px;

    }


    @media (max-width: 600px) {

      .header {

        padding: 13px;

      }


      .header h1 {

        font-size: 18px;

      }


      .header p {

        font-size: 12px;

      }


      .frame {

        width: 90%;

        height: 30%;

      }

    }

  </style>

</head>


<body>


<div class="app">


  <!-- ==========================================
       HEADER
       ========================================== -->

  <div class="header">

    <h1>
      📷 Escáner de inventario
    </h1>

    <p>
      Código de barras o código QR
    </p>

  </div>


  <!-- ==========================================
       ESCÁNER
       ========================================== -->

  <div class="scanner">


    <div class="video-container">


      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>


      <div class="frame">

        <div class="corner top-left"></div>

        <div class="corner top-right"></div>

        <div class="corner bottom-left"></div>

        <div class="corner bottom-right"></div>

        <div class="line"></div>

      </div>


      <div
        id="format"
        class="format"
      >

        Barras + QR

      </div>


      <div
        id="result"
        class="result"
      >

        <div class="result-title">

          ✓ Código detectado

        </div>


        <div
          id="resultCode"
          class="result-code"
        ></div>

      </div>


    </div>


    <div
      id="status"
      class="status"
    >

      Iniciando cámara...

    </div>


    <div class="actions">

      <button
        id="btnCancelar"
        onclick="cancelar()"
      >

        Cancelar

      </button>

    </div>


  </div>


</div>


<script>


/****************************************************
 * VARIABLES
 ****************************************************/

let reader = null;

let controls = null;

let activo = true;

let returnUrl = null;

let codigoEnviado = false;


/****************************************************
 * INICIO
 ****************************************************/

document.addEventListener(
  'DOMContentLoaded',
  iniciar
);


/****************************************************
 * INICIAR
 ****************************************************/

async function iniciar() {

  const status =
    document.getElementById(
      'status'
    );


  try {

    activo = true;

    codigoEnviado = false;


    /***********************************************
     * LEER URL DE RETORNO
     ***********************************************/

    const params =
      new URLSearchParams(
        window.location.search
      );


    returnUrl =
      params.get(
        'returnUrl'
      );


    if (!returnUrl) {

      throw new Error(
        'No se recibió la dirección de retorno.'
      );

    }


    /***********************************************
     * COMPROBAR ZXING
     ***********************************************/

    if (
      typeof ZXingBrowser ===
      'undefined'
    ) {

      throw new Error(
        'No se pudo cargar el lector ZXing. Revise la conexión a Internet.'
      );

    }


    /***********************************************
     * COMPROBAR CÁMARA
     ***********************************************/

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Este navegador no permite utilizar la cámara.'
      );

    }


    status.textContent =
      'Buscando cámaras disponibles...';


    /***********************************************
     * CREAR LECTOR
     *
     * IMPORTANTE:
     *
     * Ya NO abrimos getUserMedia()
     * manualmente.
     *
     * ZXing manejará directamente
     * la cámara.
     ***********************************************/

    reader =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    /***********************************************
     * LISTAR CÁMARAS
     ***********************************************/

    const dispositivos =
      await ZXingBrowser
        .BrowserCodeReader
        .listVideoInputDevices();


    if (
      !dispositivos ||
      dispositivos.length === 0
    ) {

      throw new Error(
        'No se encontró ninguna cámara disponible.'
      );

    }


    /***********************************************
     * SELECCIONAR CÁMARA
     ***********************************************/

    let dispositivo =
      seleccionarCamaraTrasera(
        dispositivos
      );


    /***********************************************
     * MOSTRAR ESTADO
     ***********************************************/

    status.textContent =
      'Apunte al código de barras o QR...';


    /***********************************************
     * VIDEO
     ***********************************************/

    const video =
      document.getElementById(
        'video'
      );


    /***********************************************
     * INICIAR ZXING
     ***********************************************/

    controls =
      await reader
        .decodeFromVideoDevice(

          dispositivo.deviceId,

          video,

          function(
            result,
            error
          ) {

            /*
             * Si ya se encontró un código,
             * ignorar cualquier lectura adicional.
             */

            if (!activo) {

              return;

            }


            if (codigoEnviado) {

              return;

            }


            /****************************************
             * CÓDIGO ENCONTRADO
             ****************************************/

            if (result) {

              const codigo =
                result
                  .getText();


              if (
                codigo !== null &&
                codigo !== undefined
              ) {

                const codigoLimpio =
                  String(
                    codigo
                  ).trim();


                if (
                  codigoLimpio !== ''
                ) {

                  /*
                   * Obtener tipo de código
                   * si ZXing lo proporciona.
                   */

                  let formato =
                    'Código detectado';


                  try {

                    if (
                      result.getBarcodeFormat
                    ) {

                      formato =
                        result
                          .getBarcodeFormat()
                          .toString();

                    }

                  } catch (e) {

                    console.log(e);

                  }


                  enviarResultado(

                    codigoLimpio,

                    formato

                  );

                }

              }

            }

          }

        );


  } catch (error) {

    console.error(
      'Error del escáner:',
      error
    );


    activo =
      false;


    status.innerHTML =

      '⚠ Cámara no disponible.<br><br>' +

      '<small>' +

      explicarError(error) +

      '</small>';

  }

}


/****************************************************
 * SELECCIONAR CÁMARA TRASERA
 ****************************************************/

function seleccionarCamaraTrasera(
  dispositivos
) {

  /*
   * Primero intentamos encontrar
   * una cámara claramente identificada
   * como trasera.
   */

  for (
    const camara
    of dispositivos
  ) {

    const label =
      String(
        camara.label || ''
      ).toLowerCase();


    if (

      label.includes('back') ||

      label.includes('rear') ||

      label.includes('environment') ||

      label.includes('trasera') ||

      label.includes('posterior')

    ) {

      return camara;

    }

  }


  /*
   * En muchos teléfonos la segunda
   * cámara corresponde a la trasera.
   *
   * Si hay más de una, preferimos
   * la última como segundo intento.
   */

  if (
    dispositivos.length > 1
  ) {

    return dispositivos[
      dispositivos.length - 1
    ];

  }


  /*
   * Si solamente hay una cámara,
   * utilizar esa.
   */

  return dispositivos[0];

}


/****************************************************
 * EXPLICAR ERROR
 ****************************************************/

function explicarError(error) {

  if (!error) {

    return 'Error desconocido.';

  }


  const nombre =
    error.name || '';


  if (
    nombre ===
    'NotAllowedError'
  ) {

    return (

      'El navegador no permitió el acceso a la cámara. ' +

      'Revise el permiso de cámara para esta página de GitHub Pages.'

    );

  }


  if (
    nombre ===
    'PermissionDeniedError'
  ) {

    return (

      'El permiso para utilizar la cámara fue rechazado.'

    );

  }


  if (
    nombre ===
    'NotFoundError'
  ) {

    return (

      'No se encontró una cámara disponible.'

    );

  }


  if (
    nombre ===
    'NotReadableError'
  ) {

    return (

      'La cámara está siendo utilizada por otra aplicación. ' +

      'Cierre otras aplicaciones que puedan estar usando la cámara.'

    );

  }


  if (
    nombre ===
    'OverconstrainedError'
  ) {

    return (

      'La cámara solicitada no está disponible. ' +

      'Intente nuevamente.'

    );

  }


  return (
    error.message ||
    String(error)
  );

}


/****************************************************
 * ENVIAR RESULTADO
 ****************************************************/

async function enviarResultado(
  codigo,
  formato
) {

  /*
   * Evitar doble lectura.
   */

  if (
    !activo ||
    codigoEnviado
  ) {

    return;

  }


  if (
    !codigo ||
    String(codigo).trim() === ''
  ) {

    return;

  }


  codigoEnviado =
    true;


  activo =
    false;


  const codigoFinal =
    String(
      codigo
    ).trim();


  /***********************************************
   * MOSTRAR RESULTADO
   ***********************************************/

  const status =
    document.getElementById(
      'status'
    );


  const result =
    document.getElementById(
      'result'
    );


  const resultCode =
    document.getElementById(
      'resultCode'
    );


  resultCode.textContent =
    codigoFinal;


  result.classList.add(
    'visible'
  );


  status.textContent =
    '✓ Código leído. Regresando...';


  /***********************************************
   * DETENER CÁMARA
   ***********************************************/

  detenerCamara();


  /***********************************************
   * ESPERAR UN MOMENTO
   *
   * Esto permite que el usuario vea
   * que el código fue detectado.
   ***********************************************/

  await esperar(350);


  /***********************************************
   * CONSTRUIR URL DE RETORNO
   ***********************************************/

  if (!returnUrl) {

    status.textContent =
      'Código leído, pero no existe una URL de retorno.';

    return;

  }


  let destino;


  try {

    const url =
      new URL(
        returnUrl
      );


    /*
     * set() reemplaza cualquier serial
     * anterior en vez de duplicarlo.
     */

    url.searchParams.set(
      'serial',
      codigoFinal
    );


    destino =
      url.toString();

  } catch (error) {

    console.error(
      'URL de retorno inválida:',
      error
    );


    /*
     * Método alternativo.
     */

    const separador =
      returnUrl.includes('?')
        ? '&'
        : '?';


    destino =
      returnUrl +
      separador +
      'serial=' +
      encodeURIComponent(
        codigoFinal
      );

  }


  /***********************************************
   * REGRESAR
   ***********************************************/

  window.location.href =
    destino;


  /*
   * Intentar cerrar esta pestaña.
   *
   * Algunos navegadores solamente permiten
   * cerrar ventanas abiertas mediante script.
   *
   * Si fue abierta desde window.open(),
   * normalmente funcionará.
   */

  setTimeout(
    function() {

      try {

        window.close();

      } catch (e) {

        console.log(
          'El navegador no permitió cerrar la pestaña.',
          e
        );

      }

    },
    800
  );

}


/****************************************************
 * DETENER CÁMARA
 ****************************************************/

function detenerCamara() {

  /*
   * Detener controles ZXing.
   */

  if (controls) {

    try {

      controls.stop();

    } catch (e) {

      console.log(
        'Error deteniendo controls:',
        e
      );

    }

    controls =
      null;

  }


  /*
   * Reiniciar lector.
   */

  if (reader) {

    try {

      reader.reset();

    } catch (e) {

      console.log(
        'Error haciendo reset:',
        e
      );

    }

  }


  /*
   * Detener directamente cualquier
   * stream que haya quedado asociado
   * al video.
   */

  const video =
    document.getElementById(
      'video'
    );


  if (
    video &&
    video.srcObject
  ) {

    try {

      const tracks =
        video
          .srcObject
          .getTracks();


      tracks.forEach(
        function(track) {

          try {

            track.stop();

          } catch (e) {

            console.log(e);

          }

        }
      );


    } catch (e) {

      console.log(e);

    }


    video.srcObject =
      null;

  }

}


/****************************************************
 * CANCELAR
 ****************************************************/

function cancelar() {

  if (
    !activo
  ) {

    return;

  }


  activo =
    false;


  codigoEnviado =
    true;


  detenerCamara();


  /*
   * Si tenemos URL de retorno,
   * volver directamente.
   */

  if (returnUrl) {

    window.location.href =
      returnUrl;


    /*
     * Intentar cerrar la pestaña.
     */

    setTimeout(
      function() {

        try {

          window.close();

        } catch (e) {

          console.log(e);

        }

      },
      500
    );


  } else {

    window.history.back();

  }

}


/****************************************************
 * ESPERAR
 ****************************************************/

function esperar(
  milisegundos
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        milisegundos
      );

    }
  );

}


/****************************************************
 * DETENER AL SALIR
 ****************************************************/

window.addEventListener(
  'pagehide',
  function() {

    activo =
      false;

    detenerCamara();

  }
);


window.addEventListener(
  'beforeunload',
  function() {

    activo =
      false;

    detenerCamara();

  }
);

</script>


</body>

</html>
