<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Escáner de Inventario
  </title>


  <!-- ZXING -->

  <script
    src="https://unpkg.com/@zxing/browser@latest"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #111;

      color: white;

    }


    .app {

      min-height: 100vh;

      display: flex;

      flex-direction: column;

    }


    .header {

      padding: 16px;

      background: #202124;

      text-align: center;

    }


    .header h1 {

      margin: 0;

      font-size: 20px;

    }


    .header p {

      margin: 6px 0 0;

      color: #b8b8b8;

      font-size: 13px;

    }


    .scanner {

      flex: 1;

      display: flex;

      flex-direction: column;

    }


    .video-container {

      position: relative;

      flex: 1;

      background: black;

      min-height: 55vh;

      overflow: hidden;

    }


    #video {

      width: 100%;

      height: 100%;

      object-fit: cover;

    }


    .frame {

      position: absolute;

      top: 50%;

      left: 50%;

      width: 84%;

      height: 32%;

      transform:
        translate(-50%, -50%);

      border:
        2px solid
        rgba(255,255,255,.3);

      pointer-events: none;

    }


    .corner {

      position: absolute;

      width: 30px;

      height: 30px;

      border-color: #00ff88;

      border-style: solid;

    }


    .top-left {

      top: -2px;

      left: -2px;

      border-width:
        4px 0 0 4px;

    }


    .top-right {

      top: -2px;

      right: -2px;

      border-width:
        4px 4px 0 0;

    }


    .bottom-left {

      bottom: -2px;

      left: -2px;

      border-width:
        0 0 4px 4px;

    }


    .bottom-right {

      bottom: -2px;

      right: -2px;

      border-width:
        0 4px 4px 0;

    }


    .line {

      position: absolute;

      left: 0;

      right: 0;

      top: 50%;

      height: 2px;

      background: #00ff88;

      animation:
        scan 1.8s infinite;

    }


    @keyframes scan {

      0% {
        transform: translateY(-55px);
      }

      50% {
        transform: translateY(55px);
      }

      100% {
        transform: translateY(-55px);
      }

    }


    .status {

      padding: 14px;

      text-align: center;

      background: #202124;

      font-size: 14px;

      font-weight: 600;

      min-height: 50px;

    }


    .actions {

      padding: 12px;

      background: #202124;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;

    }


    button {

      width: 100%;

      min-height: 48px;

      border: none;

      border-radius: 10px;

      color: white;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

    }


    #btnFoto {

      background: #0f9d58;

    }


    #btnCancelar {

      background: #5f6368;

    }


    button:disabled {

      opacity: .45;

      cursor: not-allowed;

    }


    .photo-area {

      display: none;

      padding: 10px;

      background: #181818;

    }


    .photo-area.visible {

      display: block;

    }


    #photoPreview {

      display: block;

      width: 100%;

      max-height: 45vh;

      object-fit: contain;

      background: black;

      border-radius: 8px;

    }


    .photo-title {

      margin-bottom: 8px;

      font-size: 13px;

      color: #b8b8b8;

      text-align: center;

    }


    .copy-area {

      display: none;

      padding: 12px;

      background: #202124;

      border-top:
        1px solid #333;

    }


    .copy-area.visible {

      display: block;

    }


    .result-text {

      background: #111;

      border:
        1px solid #444;

      border-radius: 8px;

      padding: 10px;

      word-break: break-all;

      margin-bottom: 8px;

      font-size: 14px;

    }


    #btnCopiar {

      background: #1a73e8;

    }


    .small {

      font-size: 11px;

      color: #aaa;

      margin-top: 7px;

      line-height: 1.4;

    }


    @media (max-width: 500px) {

      .video-container {

        min-height: 50vh;

      }

      .frame {

        width: 90%;

        height: 36%;

      }

      .actions {

        grid-template-columns: 1fr 1fr;

      }

    }

  </style>

</head>


<body>


<div class="app">


  <!-- ==========================================
       CABECERA
       ========================================== -->

  <div class="header">

    <h1>
      📷 Escáner de inventario
    </h1>

    <p>
      Código de barras o código QR
    </p>

  </div>


  <!-- ==========================================
       ESCÁNER
       ========================================== -->

  <div class="scanner">


    <div class="video-container">

      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>


      <div class="frame">

        <div class="corner top-left"></div>

        <div class="corner top-right"></div>

        <div class="corner bottom-left"></div>

        <div class="corner bottom-right"></div>

        <div class="line"></div>

      </div>

    </div>


    <!-- ========================================
         FOTO CAPTURADA
         ======================================== -->

    <div
      id="photoArea"
      class="photo-area"
    >

      <div class="photo-title">

        Fotografía capturada

      </div>


      <img
        id="photoPreview"
        alt="Fotografía capturada"
      >

    </div>


    <!-- ========================================
         ESTADO
         ======================================== -->

    <div
      id="status"
      class="status"
    >

      Iniciando cámara...

    </div>


    <!-- ========================================
         BOTONES
         ======================================== -->

    <div class="actions">


      <button
        id="btnFoto"
        onclick="tomarFoto()"
      >

        📸 Tomar foto

      </button>


      <button
        id="btnCancelar"
        onclick="cancelar()"
      >

        Cancelar

      </button>


    </div>


    <!-- ========================================
         RESULTADO
         ======================================== -->

    <div
      id="copyArea"
      class="copy-area"
    >

      <div class="result-text">
        <strong>Resultado:</strong>

        <div id="resultadoTexto"></div>
      </div>


      <button
        id="btnCopiar"
        onclick="copiarResultado()"
      >

        📋 Copiar código

      </button>


      <div class="small">

        El código se copia automáticamente al
        portapapeles cuando es detectado.

      </div>

    </div>


  </div>


</div>


<script>


/****************************************************
 * VARIABLES
 ****************************************************/

let reader = null;

let controls = null;

let activo = true;

let returnUrl = null;

let streamActual = null;

let ultimoResultado = '';

let analizandoFoto = false;


/*
 * Tiempo máximo para intentar analizar
 * una fotografía.
 */

const TIEMPO_MAXIMO_ANALISIS = 12000;


/****************************************************
 * INICIO
 ****************************************************/

document.addEventListener(
  'DOMContentLoaded',
  iniciar
);


/****************************************************
 * INICIAR
 ****************************************************/

async function iniciar() {

  const status =
    document.getElementById(
      'status'
    );


  try {

    const params =
      new URLSearchParams(
        window.location.search
      );


    returnUrl =
      params.get(
        'returnUrl'
      );


    if (!returnUrl) {

      throw new Error(
        'No se recibió la dirección de retorno.'
      );

    }


    if (
      typeof ZXingBrowser ===
      'undefined'
    ) {

      throw new Error(
        'No se pudo cargar ZXing.'
      );

    }


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Este navegador no permite utilizar la cámara.'
      );

    }


    status.textContent =
      'Solicitando permiso para la cámara...';


    /*
     * Solicitar una cámara de alta resolución.
     */

    streamActual =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: 'environment'
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          },

          aspectRatio: {
            ideal: 16 / 9
          }

        },

        audio: false

      });


    const video =
      document.getElementById(
        'video'
      );


    video.srcObject =
      streamActual;


    await video.play();


    status.textContent =
      'Buscando código...';


    /*
     * Crear lector.
     */

    reader =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    /*
     * Usar el stream ya abierto.
     *
     * Esto evita pedir permiso dos veces.
     */

    controls =
      await reader
        .decodeFromStream(

          streamActual,

          video,

          function(
            result,
            error
          ) {

            if (!activo) {

              return;

            }


            if (analizandoFoto) {

              return;

            }


            if (result) {

              const codigo =
                result
                  .getText()
                  .trim();


              if (codigo) {

                procesarResultado(
                  codigo
                );

              }

            }

          }

        );


  } catch (error) {

    console.error(
      error
    );


    activo =
      false;


    status.innerHTML =

      '⚠ Cámara no disponible.<br><br>' +

      '<small>' +

      explicarError(error) +

      '</small>';

  }

}


/****************************************************
 * EXPLICAR ERROR
 ****************************************************/

function explicarError(error) {

  if (!error) {

    return 'Error desconocido.';

  }


  const nombre =
    error.name || '';


  if (
    nombre ===
    'NotAllowedError'
  ) {

    return (
      'El navegador no permitió el acceso a la cámara. ' +
      'Revise el permiso de cámara para esta página.'
    );

  }


  if (
    nombre ===
    'NotFoundError'
  ) {

    return (
      'No se encontró una cámara disponible.'
    );

  }


  if (
    nombre ===
    'NotReadableError'
  ) {

    return (
      'La cámara está siendo utilizada por otra aplicación.'
    );

  }


  return (
    error.message ||
    String(error)
  );

}


/****************************************************
 * TOMAR FOTO
 ****************************************************/

async function tomarFoto() {

  if (
    !activo ||
    analizandoFoto
  ) {

    return;

  }


  const video =
    document.getElementById(
      'video'
    );


  const status =
    document.getElementById(
      'status'
    );


  const boton =
    document.getElementById(
      'btnFoto'
    );


  if (
    !video ||
    video.readyState <
    2
  ) {

    status.textContent =
      '⚠ La cámara todavía no está lista.';

    return;

  }


  analizandoFoto =
    true;


  boton.disabled =
    true;


  status.textContent =
    '📸 Capturando fotografía...';


  /*
   * Ocultar resultado anterior.
   */

  document
    .getElementById(
      'copyArea'
    )
    .classList
    .remove('visible');


  try {

    /*
     * Obtener resolución REAL del stream.
     */

    const track =
      streamActual &&
      streamActual.getVideoTracks()[0];


    let settings =
      track
        ? track.getSettings()
        : {};


    let ancho =
      settings.width ||
      video.videoWidth ||
      1920;


    let alto =
      settings.height ||
      video.videoHeight ||
      1080;


    /*
     * Evitar capturas absurdamente pequeñas.
     */

    ancho =
      Math.max(
        ancho,
        1280
      );


    alto =
      Math.max(
        alto,
        720
      );


    /*
     * Crear canvas con la resolución
     * real de la cámara.
     */

    const canvas =
      document.createElement(
        'canvas'
      );


    canvas.width =
      ancho;

    canvas.height =
      alto;


    const ctx =
      canvas.getContext(
        '2d',
        {
          willReadFrequently: true
        }
      );


    /*
     * Capturar frame.
     */

    ctx.drawImage(
      video,
      0,
      0,
      ancho,
      alto
    );


    /*
     * Mostrar inmediatamente la foto.
     */

    const imagen =
      canvas.toDataURL(
        'image/jpeg',
        0.92
      );


    const preview =
      document.getElementById(
        'photoPreview'
      );


    preview.src =
      imagen;


    document
      .getElementById(
        'photoArea'
      )
      .classList
      .add('visible');


    status.textContent =
      '🔎 Analizando fotografía...';


    /*
     * Intentar leer.
     */

    const codigo =
      await analizarFotografia(
        canvas
      );


    if (codigo) {

      procesarResultado(
        codigo
      );

    } else {

      status.innerHTML =

        '❌ No se encontró ningún código.<br>' +

        '<small>' +

        'Acérquese al QR, asegúrese de que esté enfocado y vuelva a tomar la foto.'

        +

        '</small>';

    }


  } catch (error) {

    console.error(
      'Error analizando fotografía:',
      error
    );


    status.innerHTML =

      '⚠ No se pudo analizar la fotografía.<br>' +

      '<small>' +

      (error.message ||
       'Intente nuevamente.') +

      '</small>';

  } finally {

    analizandoFoto =
      false;

    boton.disabled =
      false;

  }

}


/****************************************************
 * ANALIZAR FOTOGRAFÍA
 ****************************************************/

async function analizarFotografia(
  canvasOriginal
) {

  /*
   * Creamos un lector independiente para
   * la fotografía.
   */

  const lector =
    new ZXingBrowser
      .BrowserMultiFormatReader();


  /*
   * Lista de imágenes que vamos a probar.
   *
   * Primero la original.
   * Después diferentes recortes.
   */

  const candidatos = [];


  /*
   * 1. Imagen completa.
   */

  candidatos.push(
    canvasOriginal
  );


  const ancho =
    canvasOriginal.width;


  const alto =
    canvasOriginal.height;


  /*
   * 2. Recorte central.
   *
   * Es especialmente útil para QR pequeños.
   */

  const lado =
    Math.min(
      ancho,
      alto
    );


  const margen =
    0.82;


  const recorteCentral =
    crearRecorte(

      canvasOriginal,

      (ancho - lado * margen) / 2,

      (alto - lado * margen) / 2,

      lado * margen,

      lado * margen,

      3

    );


  candidatos.push(
    recorteCentral
  );


  /*
   * 3. Recorte más pequeño.
   *
   * Para QR pequeños pero bien centrados.
   */

  const margenPequeno =
    0.58;


  const recortePequeno =
    crearRecorte(

      canvasOriginal,

      (ancho - lado * margenPequeno) / 2,

      (alto - lado * margenPequeno) / 2,

      lado * margenPequeno,

      lado * margenPequeno,

      4

    );


  candidatos.push(
    recortePequeno
  );


  /*
   * 4. Parte superior central.
   */

  candidatos.push(

    crearRecorte(

      canvasOriginal,

      ancho * 0.10,

      0,

      ancho * 0.80,

      alto * 0.65,

      3

    )

  );


  /*
   * 5. Parte central horizontal.
   *
   * Muy útil para códigos de barras.
   */

  candidatos.push(

    crearRecorte(

      canvasOriginal,

      0,

      alto * 0.25,

      ancho,

      alto * 0.50,

      2

    )

  );


  /*
   * Probar cada candidato.
   */

  for (
    let i = 0;
    i < candidatos.length;
    i++
  ) {

    const canvas =
      candidatos[i];


    try {

      const resultado =
        await decodificarCanvasConTiempo(

          lector,

          canvas,

          1800

        );


      if (
        resultado
      ) {

        return resultado;

      }

    } catch (error) {

      console.log(
        'Intento',
        i + 1,
        'falló:',
        error
      );

    }

  }


  return null;

}


/****************************************************
 * DECODIFICAR CANVAS CON TIEMPO MÁXIMO
 ****************************************************/

function decodificarCanvasConTiempo(
  lector,
  canvas,
  tiempo
) {

  return new Promise(
    function(resolve) {

      let terminado =
        false;


      const temporizador =
        setTimeout(
          function() {

            if (
              terminado
            ) {

              return;

            }


            terminado =
              true;


            resolve(
              null
            );

          },
          tiempo
        );


      try {

        lector
          .decodeFromCanvas(
            canvas
          )
          .then(
            function(resultado) {

              if (
                terminado
              ) {

                return;

              }


              terminado =
                true;


              clearTimeout(
                temporizador
              );


              if (
                resultado
              ) {

                resolve(
                  resultado
                    .getText()
                    .trim()
                );

              } else {

                resolve(
                  null
                );

              }

            }
          )

          .catch(
            function(error) {

              if (
                terminado
              ) {

                return;

              }


              terminado =
                true;


              clearTimeout(
                temporizador
              );


              resolve(
                null
              );

            }
          );

      } catch (error) {

        if (
          terminado
        ) {

          return;

        }


        terminado =
          true;


        clearTimeout(
          temporizador
        );


        resolve(
          null
        );

      }

    }
  );

}


/****************************************************
 * CREAR RECORTE
 ****************************************************/

function crearRecorte(
  origen,
  x,
  y,
  ancho,
  alto,
  escala
) {

  /*
   * Limitar coordenadas.
   */

  x =
    Math.max(
      0,
      Math.floor(x)
    );


  y =
    Math.max(
      0,
      Math.floor(y)
    );


  ancho =
    Math.min(
      origen.width - x,
      Math.floor(ancho)
    );


  alto =
    Math.min(
      origen.height - y,
      Math.floor(alto)
    );


  /*
   * Nunca crear canvas vacío.
   */

  ancho =
    Math.max(
      10,
      ancho
    );


  alto =
    Math.max(
      10,
      alto
    );


  const canvas =
    document.createElement(
      'canvas'
    );


  canvas.width =
    Math.floor(
      ancho * escala
    );


  canvas.height =
    Math.floor(
      alto * escala
    );


  const ctx =
    canvas.getContext(
      '2d',
      {
        willReadFrequently: true
      }
    );


  /*
   * Mejor calidad de interpolación.
   */

  ctx.imageSmoothingEnabled =
    true;


  ctx.imageSmoothingQuality =
    'high';


  ctx.drawImage(

    origen,

    x,
    y,
    ancho,
    alto,

    0,
    0,
    canvas.width,
    canvas.height

  );


  return canvas;

}


/****************************************************
 * PROCESAR RESULTADO
 ****************************************************/

async function procesarResultado(
  codigo
) {

  if (!codigo) {

    return;

  }


  codigo =
    String(
      codigo
    ).trim();


  if (!codigo) {

    return;

  }


  activo =
    false;


  ultimoResultado =
    codigo;


  /*
   * Detener cámara.
   */

  detenerCamara();


  /*
   * Mostrar resultado.
   */

  document
    .getElementById(
      'resultadoTexto'
    )
    .textContent =
    codigo;


  document
    .getElementById(
      'copyArea'
    )
    .classList
    .add('visible');


  document
    .getElementById(
      'status'
    )
    .textContent =
    '✓ Código detectado';


  /*
   * Copiar automáticamente.
   */

  await copiarResultado();


}


/****************************************************
 * COPIAR RESULTADO
 ****************************************************/

async function copiarResultado() {

  if (!ultimoResultado) {

    return;

  }


  try {

    await navigator
      .clipboard
      .writeText(
        ultimoResultado
      );


    document
      .getElementById(
        'btnCopiar'
      )
      .textContent =
      '✓ Copiado';


    document
      .getElementById(
        'status'
      )
      .textContent =
      '✓ Código copiado al portapapeles';


  } catch (error) {

    console.log(
      'No se pudo copiar automáticamente:',
      error
    );


    /*
     * El resultado sigue visible y el usuario
     * puede presionar Copiar.
     */

    document
      .getElementById(
        'btnCopiar'
      )
      .textContent =
      '📋 Copiar código';

  }

}


/****************************************************
 * DETENER CÁMARA
 ****************************************************/

function detenerCamara() {

  if (controls) {

    try {

      controls.stop();

    } catch (e) {

      console.log(e);

    }

    controls =
      null;

  }


  if (reader) {

    try {

      reader.reset();

    } catch (e) {

      console.log(e);

    }

  }


  if (streamActual) {

    streamActual
      .getTracks()
      .forEach(
        function(track) {

          try {

            track.stop();

          } catch (e) {

            console.log(e);

          }

        }
      );


    streamActual =
      null;

  }


  const video =
    document.getElementById(
      'video'
    );


  if (
    video &&
    video.srcObject
  ) {

    video.srcObject =
      null;

  }

}


/****************************************************
 * CANCELAR
 ****************************************************/

function cancelar() {

  activo =
    false;


  detenerCamara();


  if (returnUrl) {

    window.location.href =
      returnUrl;

  } else {

    window.history.back();

  }

}


/****************************************************
 * PREVENIR CIERRE CON CÁMARA ACTIVA
 ****************************************************/

window.addEventListener(
  'pagehide',
