<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Escáner de Inventario
  </title>


  <!-- ZXing -->

  <script
    src="https://unpkg.com/@zxing/browser@latest"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #111;

      color: white;

    }


    .app {

      min-height: 100vh;

      display: flex;

      flex-direction: column;

    }


    .header {

      padding: 16px;

      background: #202124;

      text-align: center;

    }


    .header h1 {

      margin: 0;

      font-size: 20px;

    }


    .header p {

      margin: 6px 0 0;

      color: #b8b8b8;

      font-size: 13px;

    }


    .scanner {

      flex: 1;

      display: flex;

      flex-direction: column;

    }


    .video-container {

      position: relative;

      flex: 1;

      background: black;

      min-height: 55vh;

      overflow: hidden;

    }


    #video {

      width: 100%;

      height: 100%;

      object-fit: cover;

    }


    .frame {

      position: absolute;

      top: 50%;

      left: 50%;

      width: 86%;

      height: 28%;

      transform:
        translate(-50%, -50%);

      border:
        2px solid
        rgba(255,255,255,.25);

      pointer-events: none;

    }


    .corner {

      position: absolute;

      width: 34px;

      height: 34px;

      border-color: #00ff88;

      border-style: solid;

    }


    .top-left {

      top: -2px;

      left: -2px;

      border-width:
        4px 0 0 4px;

    }


    .top-right {

      top: -2px;

      right: -2px;

      border-width:
        4px 4px 0 0;

    }


    .bottom-left {

      bottom: -2px;

      left: -2px;

      border-width:
        0 0 4px 4px;

    }


    .bottom-right {

      bottom: -2px;

      right: -2px;

      border-width:
        0 4px 4px 0;

    }


    .line {

      position: absolute;

      left: 0;

      right: 0;

      top: 50%;

      height: 2px;

      background: #00ff88;

      animation:
        scan 1.8s infinite;

    }


    @keyframes scan {

      0% {
        transform: translateY(-45px);
      }

      50% {
        transform: translateY(45px);
      }

      100% {
        transform: translateY(-45px);
      }

    }


    .status {

      padding: 14px;

      text-align: center;

      background: #202124;

      font-size: 14px;

      font-weight: 600;

    }


    .result {

      display: none;

      padding: 15px;

      background: #17251d;

      border-top:
        1px solid #2d573c;

    }


    .result.visible {

      display: block;

    }


    .result-title {

      color: #7dffad;

      font-size: 12px;

      font-weight: 700;

      margin-bottom: 6px;

    }


    .result-code {

      background: #111;

      border-radius: 8px;

      padding: 12px;

      word-break: break-all;

      font-size: 16px;

      line-height: 1.4;

    }


    .actions {

      padding: 12px;

      background: #202124;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;

    }


    button {

      width: 100%;

      min-height: 46px;

      border: none;

      border-radius: 9px;

      background: #1a73e8;

      color: white;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

    }


    button.secondary {

      background: #5f6368;

    }


    button.green {

      background: #0f9d58;

    }


    button.orange {

      background: #e37400;

    }


    button:disabled {

      opacity: .45;

      cursor: not-allowed;

    }


    .photo-area {

      display: none;

      background: #000;

      padding: 10px;

    }


    .photo-area.visible {

      display: block;

    }


    #capturedImage {

      width: 100%;

      max-height: 45vh;

      object-fit: contain;

      display: block;

      margin: auto;

      border-radius: 8px;

    }


    #canvas {

      display: none;

    }


    .help {

      padding: 12px 15px;

      background: #292a2d;

      color: #b8b8b8;

      font-size: 12px;

      line-height: 1.5;

      text-align: center;

    }


    @media (max-width: 480px) {

      .actions {

        grid-template-columns:
          1fr 1fr;

      }

      button {

        font-size: 13px;

      }

    }

  </style>

</head>


<body>


<div class="app">


  <div class="header">

    <h1>
      📷 Escáner de inventario
    </h1>

    <p>
      Barras y códigos QR
    </p>

  </div>


  <div class="scanner">


    <!-- ========================================
         CÁMARA
         ======================================== -->

    <div class="video-container">


      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>


      <div class="frame">

        <div class="corner top-left"></div>

        <div class="corner top-right"></div>

        <div class="corner bottom-left"></div>

        <div class="corner bottom-right"></div>

        <div class="line"></div>

      </div>


    </div>


    <!-- ========================================
         FOTO CAPTURADA
         ======================================== -->

    <div
      id="photoArea"
      class="photo-area"
    >

      <img
        id="capturedImage"
        alt="Imagen capturada"
      >

    </div>


    <canvas
      id="canvas"
    ></canvas>


    <!-- ========================================
         ESTADO
         ======================================== -->

    <div
      id="status"
      class="status"
    >

      Iniciando cámara...

    </div>


    <!-- ========================================
         RESULTADO
         ======================================== -->

    <div
      id="result"
      class="result"
    >

      <div class="result-title">

        ✓ CÓDIGO DETECTADO

      </div>


      <div
        id="resultCode"
        class="result-code"
      ></div>

    </div>


    <!-- ========================================
         AYUDA
         ======================================== -->

    <div class="help">

      Si la cámara no detecta el código,
      pulse <strong>📸 Tomar foto</strong>.
      La imagen se analizará nuevamente.

    </div>


    <!-- ========================================
         BOTONES
         ======================================== -->

    <div class="actions">

      <button
        id="btnFoto"
        class="orange"
        onclick="tomarFoto()"
      >

        📸 Tomar foto

      </button>


      <button
        id="btnCopiar"
        class="green"
        onclick="copiarResultado()"
        disabled
      >

        📋 Copiar

      </button>


      <button
        id="btnNuevo"
        class="secondary"
        onclick="nuevoEscaneo()"
      >

        🔄 Escanear de nuevo

      </button>


      <button
        id="btnSalir"
        class="secondary"
        onclick="salir()"
      >

        ✕ Salir

      </button>

    </div>


  </div>


</div>


<script>


/****************************************************
 * VARIABLES
 ****************************************************/

let reader = null;

let controls = null;

let activo = true;

let codigoDetectado = '';

let dispositivoSeleccionado = null;


/****************************************************
 * INICIO
 ****************************************************/

document.addEventListener(
  'DOMContentLoaded',
  iniciar
);


/****************************************************
 * INICIAR
 ****************************************************/

async function iniciar() {

  const status =
    document.getElementById(
      'status'
    );


  try {

    if (
      typeof ZXingBrowser ===
      'undefined'
    ) {

      throw new Error(
        'No se pudo cargar ZXing.'
      );

    }


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Este navegador no permite utilizar la cámara.'
      );

    }


    status.textContent =
      'Solicitando permiso para la cámara...';


    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: 'environment'
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    stream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });


    status.textContent =
      'Buscando cámara...';


    reader =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    const dispositivos =
      await ZXingBrowser
        .BrowserCodeReader
        .listVideoInputDevices();


    if (
      !dispositivos ||
      dispositivos.length === 0
    ) {

      throw new Error(
        'No se encontró ninguna cámara.'
      );

    }


    dispositivoSeleccionado =
      dispositivos[0];


    for (
      const camara of dispositivos
    ) {

      const label =
        String(
          camara.label || ''
        ).toLowerCase();


      if (

        label.includes('back') ||

        label.includes('rear') ||

        label.includes('environment') ||

        label.includes('trasera') ||

        label.includes('posterior')

      ) {

        dispositivoSeleccionado =
          camara;

        break;

      }

    }


    iniciarLectura();


  } catch (error) {

    console.error(
      error
    );


    activo =
      false;


    status.innerHTML =

      '⚠ Cámara no disponible.<br><br>' +

      '<small>' +

      explicarError(error) +

      '</small>';

  }

}


/****************************************************
 * INICIAR LECTURA CONTINUA
 ****************************************************/

async function iniciarLectura() {

  if (!reader) {

    return;

  }


  activo =
    true;


  const status =
    document.getElementById(
      'status'
    );


  status.textContent =
    'Apunte al código de barras o QR...';


  const video =
    document.getElementById(
      'video'
    );


  try {

    controls =
      await reader.decodeFromVideoDevice(

        dispositivoSeleccionado
          ? dispositivoSeleccionado.deviceId
          : undefined,

        video,

        function(
          result,
          error
        ) {

          if (!activo) {

            return;

          }


          if (result) {

            const texto =
              result
                .getText()
                .trim();


            if (texto) {

              codigoDetectado =
                texto;


              mostrarResultado(
                texto
              );

            }

          }

        }

      );


  } catch (error) {

    console.error(
      error
    );


    status.textContent =
      '⚠ No se pudo iniciar la lectura.';

  }

}


/****************************************************
 * MOSTRAR RESULTADO
 ****************************************************/

async function mostrarResultado(
  codigo
) {

  /*
   * Evitar múltiples detecciones
   * consecutivas.
   */

  if (!activo) {

    return;

  }


  activo =
    false;


  detenerCamara();


  codigoDetectado =
    codigo;


  const result =
    document.getElementById(
      'result'
    );


  const resultCode =
    document.getElementById(
      'resultCode'
    );


  const status =
    document.getElementById(
      'status'
    );


  resultCode.textContent =
    codigo;


  result.classList.add(
    'visible'
  );


  status.textContent =
    '✓ Código detectado.';


  document.getElementById(
    'btnCopiar'
  ).disabled = false;


  /*
   * Copiar automáticamente.
   *
   * IMPORTANTE:
   * Esperamos a que la operación de copia
   * termine completamente.
   */

  const copiado =
    await copiarAutomaticamente();


  /*
   * Solamente si la copia fue exitosa,
   * ejecutar la misma función utilizada
   * por el botón SALIR.
   */

  if (copiado) {

    setTimeout(
      function() {

        salir();

      },
      300
    );

  }

}


/****************************************************
 * COPIA AUTOMÁTICA
 ****************************************************/

async function copiarAutomaticamente() {

  if (!codigoDetectado) {

    return false;

  }


  try {

    await navigator.clipboard.writeText(
      codigoDetectado
    );


    document.getElementById(
      'status'
    ).textContent =
      '✓ Código copiado. Regresando...';


    /*
     * La copia terminó correctamente.
     */

    return true;


  } catch (error) {

    console.warn(
      'No se pudo copiar automáticamente:',
      error
    );


    document.getElementById(
      'status'
    ).textContent =
      '✓ Código detectado. Pulse "Copiar".';


    /*
     * Si no se pudo copiar,
     * NO cerramos la ventana.
     */

    return false;

  }

}


/****************************************************
 * COPIAR RESULTADO
 ****************************************************/

async function copiarResultado() {

  if (!codigoDetectado) {

    return;

  }


  try {

    await navigator.clipboard.writeText(
      codigoDetectado
    );


    document.getElementById(
      'status'
    ).textContent =
      '✓ Código copiado.';


  } catch (error) {

    /*
     * Segundo intento usando textarea.
     */

    try {

      const textarea =
        document.createElement(
          'textarea'
        );


      textarea.value =
        codigoDetectado;


      textarea.style.position =
        'fixed';

      textarea.style.opacity =
        '0';


      document.body.appendChild(
        textarea
      );


      textarea.focus();

      textarea.select();


      document.execCommand(
        'copy'
      );


      textarea.remove();


      document.getElementById(
        'status'
      ).textContent =
        '✓ Código copiado.';

    } catch (e) {

      document.getElementById(
        'status'
      ).textContent =
        '⚠ No se pudo copiar automáticamente. Mantenga presionado el código para copiarlo.';

    }

  }

}


/****************************************************
 * TOMAR FOTO
 ****************************************************/

function tomarFoto() {

  const video =
    document.getElementById(
      'video'
    );


  const canvas =
    document.getElementById(
      'canvas'
    );


  const image =
    document.getElementById(
      'capturedImage'
    );


  if (
    !video ||
    !video.videoWidth
  ) {

    document.getElementById(
      'status'
    ).textContent =
      '⚠ La cámara todavía no está lista.';

    return;

  }


  /*
   * Detener lectura continua.
   */

  activo =
    false;


  detenerCamara();


  /*
   * Capturar imagen con resolución
   * nativa del video.
   */

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  const ctx =
    canvas.getContext(
      '2d'
    );


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  const dataUrl =
    canvas.toDataURL(
      'image/jpeg',
      0.95
    );


  image.src =
    dataUrl;


  document
    .getElementById(
      'photoArea'
    )
    .classList.add(
      'visible'
    );


  document.getElementById(
    'status'
  ).textContent =
    'Analizando fotografía...';


  analizarImagen(
    dataUrl
  );

}


/****************************************************
 * ANALIZAR IMAGEN
 ****************************************************/

async function analizarImagen(
  dataUrl
) {

  try {

    const img =
      new Image();


    img.onload =
      async function() {

        try {

          const canvas =
            document.createElement(
              'canvas'
            );


          const maxWidth =
            1800;


          const escala =
            img.width > maxWidth
              ? maxWidth / img.width
              : 1;


          canvas.width =
            Math.round(
              img.width * escala
            );


          canvas.height =
            Math.round(
              img.height * escala
            );


          const ctx =
            canvas.getContext(
              '2d',
              {
                willReadFrequently: true
              }
            );


          ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
          );


          const lector =
            new ZXingBrowser
              .BrowserMultiFormatReader();


          const resultado =
            await lector
              .decodeFromImageUrl(
                canvas.toDataURL(
                  'image/jpeg',
                  0.95
                )
              );


          if (
            resultado &&
            resultado.getText()
          ) {

            mostrarResultado(
              resultado
                .getText()
                .trim()
            );


            return;

          }


          throw new Error(
            'No se encontró código.'
          );


        } catch (error) {

          console.warn(
            'No se pudo analizar la imagen:',
            error
          );


          document.getElementById(
            'status'
          ).textContent =
            '⚠ No se encontró un código. Acerque la cámara o vuelva a tomar la foto.';

          activo =
            false;

        }

      };


    img.src =
      dataUrl;


  } catch (error) {

    console.error(
      error
    );


    document.getElementById(
      'status'
    ).textContent =
      '⚠ No se pudo analizar la fotografía.';

  }

}


/****************************************************
 * NUEVO ESCANEO
 ****************************************************/

function nuevoEscaneo() {

  codigoDetectado =
    '';


  activo =
    true;


  document
    .getElementById(
      'result'
    )
    .classList.remove(
      'visible'
    );


  document
    .getElementById(
      'photoArea'
    )
    .classList.remove(
      'visible'
    );


  document.getElementById(
    'btnCopiar'
  ).disabled = true;


  document.getElementById(
    'status'
  ).textContent =
    'Reiniciando cámara...';


  iniciarLectura();

}


/****************************************************
 * DETENER CÁMARA
 ****************************************************/

function detenerCamara() {

  if (controls) {

    try {

      controls.stop();

    } catch (e) {

      console.log(e);

    }

    controls =
      null;

  }


  if (reader) {

    try {

      reader.reset();

    } catch (e) {

      console.log(e);

    }

  }


  const video =
    document.getElementById(
      'video'
    );


  if (
    video &&
    video.srcObject
  ) {

    video.srcObject
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    video.srcObject =
      null;

  }

}


/****************************************************
 * SALIR
 ****************************************************/

function salir() {

  activo =
    false;


  detenerCamara();


  /*
   * Cerrar la pestaña del escáner.
   */

  window.close();


  /*
   * Si el navegador no permite cerrar
   * la pestaña, mostramos instrucciones.
   */

  setTimeout(
    function() {

      document.getElementById(
        'status'
      ).textContent =
        'Puede cerrar esta pestaña manualmente. El código permanece en el portapapeles.';

    },
    300
  );

}


/****************************************************
 * EXPLICAR ERROR
 ****************************************************/

function explicarError(error) {

  if (!error) {

    return 'Error desconocido.';

  }


  const nombre =
    error.name || '';


  if (
    nombre ===
    'NotAllowedError'
  ) {

    return (
      'El navegador no permitió el acceso a la cámara. ' +
      'Revise el permiso de cámara para esta página.'
    );

  }


  if (
    nombre ===
    'NotFoundError'
  ) {

    return (
      'No se encontró una cámara disponible.'
    );

  }


  if (
    nombre ===
    'NotReadableError'
  ) {

    return (
      'La cámara está siendo utilizada por otra aplicación.'
    );

  }


  if (
    nombre ===
    'SecurityError'
  ) {

    return (
      'El navegador bloqueó el acceso a la cámara por seguridad.'
    );

  }


  return (
    error.message ||
    String(error)
  );

}


/****************************************************
 * LIMPIEZA
 ****************************************************/

window.addEventListener(
  'pagehide',
  function() {

    activo =
      false;

    detenerCamara();

  }
);

</script>


</body>

</html>
